<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publisher Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            padding: 18px 25px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }
        header h1 { color: #fff; font-weight: 600; font-size: 22px; }
        .logout-btn {
            padding: 10px 22px;
            background: rgba(229,62,62,0.8);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        .logout-btn:hover { background: #e53e3e; }
        .link-generator {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 25px;
        }
        .link-generator h3 { color: #fff; margin-bottom: 15px; font-weight: 500; font-size: 18px; }
        .link-input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .link-input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            font-size: 15px;
            background: rgba(255,255,255,0.04);
            color: #fff;
            min-width: 180px;
        }
        .link-input-group input::placeholder { color: rgba(255,255,255,0.3); }
        .link-input-group input:focus { outline: none; border-color: #667eea; }
        .link-input-group button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .link-input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(102,126,234,0.3);
        }
        .link-output {
            margin-top: 15px;
            padding: 15px;
            background: rgba(72,187,120,0.08);
            border-radius: 12px;
            border: 1px solid rgba(72,187,120,0.15);
            display: none;
        }
        .link-output p { color: rgba(255,255,255,0.8); }
        .link-output .copy-btn {
            padding: 8px 16px;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .visitors-table {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .visitors-table h2 { color: #fff; margin-bottom: 18px; font-weight: 500; font-size: 18px; }
        .visitor-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .visitor-card .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .visitor-card .header strong { color: #fff; font-size: 14px; }
        .visitor-card .header .info { color: rgba(255,255,255,0.5); font-size: 13px; }
        .visitor-card .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }
        .visitor-card .badge.active { background: rgba(72,187,120,0.15); color: #48bb78; border: 1px solid rgba(72,187,120,0.15); }
        .visitor-card .badge.inactive { background: rgba(252,129,129,0.15); color: #fc8181; border: 1px solid rgba(252,129,129,0.15); }
        .visitor-card .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .visitor-card .actions button {
            padding: 5px 12px;
            background: rgba(102,126,234,0.15);
            color: #fff;
            border: 1px solid rgba(102,126,234,0.12);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .visitor-card .actions button:hover { background: rgba(102,126,234,0.3); }
        .visitor-card .actions button.download { background: rgba(72,187,120,0.15); border-color: rgba(72,187,120,0.15); }
        .visitor-card .actions button.download:hover { background: rgba(72,187,120,0.3); }
        .notification {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: rgba(72,187,120,0.92);
            backdrop-filter: blur(10px);
            color: white;
            padding: 14px 22px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            z-index: 9999;
            font-weight: 500;
            font-size: 14px;
        }
        .empty-state { color: rgba(255,255,255,0.3); text-align: center; padding: 40px 20px; font-size: 15px; }
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 400px;
        }
        .login-box h2 { color: #fff; text-align: center; margin-bottom: 20px; font-weight: 600; }
        .login-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            font-size: 15px;
            background: rgba(255,255,255,0.04);
            color: #fff;
            margin-bottom: 12px;
        }
        .login-box input::placeholder { color: rgba(255,255,255,0.3); }
        .login-box input:focus { outline: none; border-color: #667eea; }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .login-box button:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(102,126,234,0.3); }
        .login-box .error { color: #fc8181; text-align: center; margin-top: 10px; font-size: 14px; }
        .serial-number {
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            margin-right: 6px;
        }
        .publisher-badge {
            background: #9f7aea;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            display: inline-block;
            margin-left: 8px;
        }
        @media (max-width: 768px) {
            .login-box { padding: 25px; }
            .link-input-group input { min-width: 140px; }
            .visitor-card .header { flex-direction: column; align-items: flex-start; }
        }
        @media (max-width: 480px) {
            body { padding: 10px; }
            header h1 { font-size: 18px; }
            .link-generator { padding: 15px; }
            .visitors-table { padding: 15px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="loginScreen" class="login-container">
            <div class="login-box">
                <h2>📢 Publisher Login</h2>
                <input type="email" id="loginEmail" placeholder="Email address">
                <input type="password" id="loginPassword" placeholder="Password">
                <button onclick="publisherLogin()">Login</button>
                <div id="loginError" class="error"></div>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboardScreen" style="display:none;">
            <div class="container">
                <header>
                    <h1>📢 Publisher Dashboard</h1>
                    <button onclick="publisherLogout()" class="logout-btn">Logout</button>
                </header>

                <div class="link-generator">
                    <h3>🔗 Generate Power Link <span class="publisher-badge">PUBLISHER</span></h3>
                    <div class="link-input-group">
                        <input type="url" id="publisherCustomUrl" placeholder="Enter URL to redirect" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
                        <button onclick="publisherGenerateLink()">Generate Link</button>
                    </div>
                    <div class="link-output" id="publisherLinkOutput">
                        <p><strong>✅ Publisher Link Generated:</strong></p>
                        <div style="display:flex; gap:8px; margin-top:8px;">
                            <input type="text" id="publisherGeneratedLink" readonly style="flex:1; padding:8px; border:2px solid #9f7aea; border-radius:5px; background:rgba(255,255,255,0.05); color:#fff; font-size:13px;">
                            <button onclick="copyPublisherLink()" class="copy-btn">📋 Copy</button>
                        </div>
                        <p style="font-size:12px; color:#9f7aea; margin-top:5px;">📌 This link will only show data in this publisher dashboard</p>
                    </div>
                </div>

                <!-- Visitor History - Only Publisher Visitors -->
                <div class="visitors-table">
                    <h2>📋 Publisher Visitor History <span class="publisher-badge">📢 PUBLISHER</span></h2>
                    <div id="publisherUsersList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let publisherId = null;
        let publisherData = null;

        // Check for auto-login
        const urlParams = new URLSearchParams(window.location.search);
        const directId = urlParams.get('id');
        const autoLogin = urlParams.get('auto') === 'true';
        
        if (directId && autoLogin) {
            fetch(`/api/publisher-data/${directId}`)
                .then(response => response.json())
                .then(data => {
                    if (data) {
                        publisherId = directId;
                        publisherData = data;
                        document.getElementById('loginScreen').style.display = 'none';
                        document.getElementById('dashboardScreen').style.display = 'block';
                        displayPublisherUsers(data.users || []);
                    }
                })
                .catch(() => {});
        }

        // ============================================
        // PUBLISHER LOGIN
        // ============================================
        function publisherLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = '';

            if (!email || !password) {
                errorDiv.textContent = 'Please enter email and password';
                return;
            }

            fetch('/publisher-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    publisherId = data.publisherId;
                    loadPublisherDashboard();
                } else if (data.suspended) {
                    errorDiv.textContent = 'Your account has been suspended. Please contact admin.';
                } else {
                    errorDiv.textContent = 'Invalid email or password';
                }
            })
            .catch(() => {
                errorDiv.textContent = 'Server error. Please try again.';
            });
        }

        // ============================================
        // LOAD PUBLISHER DASHBOARD
        // ============================================
        function loadPublisherDashboard() {
            fetch(`/api/publisher-data/${publisherId}`)
                .then(response => response.json())
                .then(data => {
                    publisherData = data;
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('dashboardScreen').style.display = 'block';
                    displayPublisherUsers(data.users || []);
                })
                .catch(() => {
                    alert('Failed to load dashboard');
                });
        }

        // ============================================
        // PUBLISHER GENERATE LINK
        // ============================================
        function publisherGenerateLink() {
            const url = document.getElementById('publisherCustomUrl').value;
            if (!url) {
                alert('Please enter a URL');
                return;
            }

            fetch('/api/publisher-generate-link', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ redirectUrl: url })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const output = document.getElementById('publisherLinkOutput');
                    output.style.display = 'block';
                    document.getElementById('publisherGeneratedLink').value = data.link;
                    
                    if (!publisherData.users) publisherData.users = [];
                    publisherData.users.push({
                        id: data.visitorId,
                        link: data.link,
                        redirectUrl: data.redirectUrl,
                        createdAt: new Date().toISOString()
                    });
                    displayPublisherUsers(publisherData.users);
                    showNotification('✅ Link generated successfully!');
                }
            })
            .catch(error => {
                alert('Error: ' + error.message);
            });
        }

        // ============================================
        // COPY PUBLISHER LINK
        // ============================================
        function copyPublisherLink() {
            const input = document.getElementById('publisherGeneratedLink');
            input.select();
            document.execCommand('copy');
            showNotification('📋 Link copied!');
        }

        // ============================================
        // DISPLAY PUBLISHER USERS (Only Publisher Visitors)
        // ============================================
        function displayPublisherUsers(users) {
            const container = document.getElementById('publisherUsersList');
            container.innerHTML = '';

            if (!users || users.length === 0) {
                container.innerHTML = '<div class="empty-state">No publisher visitors yet. Generate a link to start.</div>';
                return;
            }

            users.forEach((user, index) => {
                const card = document.createElement('div');
                card.className = 'visitor-card';
                const locationStr = user.location ? `${user.location.city || ''} ${user.location.state || ''} ${user.location.country || ''}` : '';
                card.innerHTML = `
                    <div class="header">
                        <div>
                            <strong><span class="serial-number">#${index + 1}</span> ${user.id || 'N/A'}</strong>
                            <span class="publisher-badge">📢 PUBLISHER</span>
                            <div class="info">📱 ${user.deviceName || 'Unknown'} ${user.ip ? `• 🌐 ${user.ip}` : ''}</div>
                            <div class="info">📅 ${user.visitDate ? new Date(user.visitDate).toLocaleString() : 'Not visited yet'}</div>
                            ${locationStr ? `<div class="info">📍 ${locationStr}</div>` : ''}
                            ${user.battery ? `<div class="info">🔋 ${user.battery}%</div>` : ''}
                        </div>
                        <span class="badge ${user.connected ? 'active' : 'inactive'}">
                            ${user.connected ? '🟢 Active' : '🔴 Offline'}
                        </span>
                    </div>
                    <div class="actions">
                        <button onclick="copyToClipboard('${user.id}')">📋 Copy ID</button>
                        ${user.frontCamera ? `<button class="download" onclick="downloadPhoto('${user.frontCamera.image || user.frontCamera}', 'front-${user.id}.jpg')">⬇️ Front</button>` : ''}
                        ${user.backCamera ? `<button class="download" onclick="downloadPhoto('${user.backCamera.image || user.backCamera}', 'back-${user.id}.jpg')">⬇️ Back</button>` : ''}
                        ${locationStr ? `<button onclick="copyToClipboard('${locationStr}')">📍 Copy Location</button>` : ''}
                        ${user.location ? `<button onclick="copyToClipboard('${user.location.lat || ''}, ${user.location.lng || ''}')">📍 Copy Coords</button>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ============================================
        // COPY FUNCTION
        // ============================================
        function copyToClipboard(text) {
            if (!text) {
                showNotification('❌ Nothing to copy');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                showNotification('✅ Copied!');
            }).catch(() => {
                const input = document.createElement('input');
                input.value = text;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showNotification('✅ Copied!');
            });
        }

        // ============================================
        // DOWNLOAD PHOTO
        // ============================================
        function downloadPhoto(imageData, filename) {
            if (!imageData) {
                showNotification('❌ No photo to download');
                return;
            }
            try {
                const link = document.createElement('a');
                link.href = imageData;
                link.download = filename || 'photo.jpg';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showNotification('⬇️ Downloaded!');
            } catch (e) {
                showNotification('❌ Error downloading');
            }
        }

        // ============================================
        // NOTIFICATION
        // ============================================
        function showNotification(message) {
            const existing = document.querySelector('.notification');
            if (existing) existing.remove();
            const div = document.createElement('div');
            div.className = 'notification';
            div.textContent = message;
            document.body.appendChild(div);
            setTimeout(() => {
                div.style.opacity = '0';
                div.style.transition = 'opacity 0.5s';
                setTimeout(() => div.remove(), 500);
            }, 3000);
        }

        // ============================================
        // PUBLISHER LOGOUT
        // ============================================
        function publisherLogout() {
            fetch('/logout', { method: 'POST' })
                .then(() => {
                    publisherId = null;
                    document.getElementById('loginScreen').style.display = 'flex';
                    document.getElementById('dashboardScreen').style.display = 'none';
                    document.getElementById('loginEmail').value = '';
                    document.getElementById('loginPassword').value = '';
                });
        }

        document.getElementById('loginPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') publisherLogin();
        });
        document.getElementById('loginEmail').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('loginPassword').focus();
        });

        fetch('/api/check-session')
            .then(response => {
                if (response.status === 401) {
                    if (!publisherId) {
                        document.getElementById('loginScreen').style.display = 'flex';
                        document.getElementById('dashboardScreen').style.display = 'none';
                    }
                }
                return response.json();
            })
            .then(data => {
                if (data.authenticated && data.type === 'publisher') {
                    publisherId = data.id;
                    loadPublisherDashboard();
                }
            })
            .catch(() => {});
    </script>
</body>
</html>
